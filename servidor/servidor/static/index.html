<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Motora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de celular centralizado, abas fixas no topo (Passageira / Motorista / Central), botão SOS flutuante */
:root{
  --bg:#F6F1F4; --surface:#FFFFFF; --ink:#24161F; --muted:#6F5E69; --line:#E7DCE3;
  --accent:#A8235A; --accent-ink:#FFFFFF; --accent-soft:#F7DFEA;
  --map:#EEE6EB; --street:#FFFFFF; --sos:#D42A2A; --sos-soft:#FCE3E3;
  --ok:#1D7A4C; --ok-soft:#DDF2E7; --warn:#9A5C00; --warn-soft:#FBEBCF;
  --z1:#F3E3EA; --z2:#E9E6F2; --z3:#E5EEE9; --z4:#F2EBDD; --z0:#F0D9E3;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150F16; --surface:#211923; --ink:#F4EAF0; --muted:#B5A2AE; --line:#3A2D3B;
  --accent:#E5679A; --accent-ink:#1B0E15; --accent-soft:#3D1F2E;
  --map:#261D29; --street:#3A2E3D; --sos:#FF5C5C; --sos-soft:#3E1C1C;
  --ok:#55C893; --ok-soft:#173326; --warn:#EDAA45; --warn-soft:#3A2A12;
  --z1:#33202B; --z2:#262438; --z3:#1F2F28; --z4:#332B1D; --z0:#3D2533; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150F16; --surface:#211923; --ink:#F4EAF0; --muted:#B5A2AE; --line:#3A2D3B;
  --accent:#E5679A; --accent-ink:#1B0E15; --accent-soft:#3D1F2E;
  --map:#261D29; --street:#3A2E3D; --sos:#FF5C5C; --sos-soft:#3E1C1C;
  --ok:#55C893; --ok-soft:#173326; --warn:#EDAA45; --warn-soft:#3A2A12;
  --z1:#33202B; --z2:#262438; --z3:#1F2F28; --z4:#332B1D; --z0:#3D2533; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:1.6rem;font-weight:800;color:var(--accent)}
.brand small{color:var(--muted);font-size:.8rem}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.simbar{max-width:980px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:.85rem}
.simbar select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
main{max-width:980px;margin:0 auto;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
textarea{font:inherit;width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink)}
a.btn{text-decoration:none;text-align:center;box-sizing:border-box;display:block}
.btn.wa{background:#1F8A4C;color:#fff}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.sm{padding:8px 12px;border-radius:10px;width:auto;font-size:.88rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.hot{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.night{background:var(--z2);color:var(--ink);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--sos-soft);color:var(--sos);border-color:transparent}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--accent-soft)}
.av.lg{width:84px;height:84px}
.person{display:flex;gap:12px;align-items:center;min-width:0}
.person > div{min-width:0}
.mapbox{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--map);position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox.click svg{cursor:crosshair}
.maphint{display:block;background:var(--surface);color:var(--muted);font-size:.8rem;padding:7px 10px;border-top:1px solid var(--line)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fare{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.92rem}
.fare .tot{font-weight:800;font-size:1.15rem;border-top:1px solid var(--line);padding-top:7px}
.fare .tot.v{font-family:var(--display)}
.big{font-family:var(--display);font-size:2rem;font-weight:800;line-height:1}
.alert{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-weight:600}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--sos-soft);color:var(--sos)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--accent-soft);color:var(--ink)}
.pin{font-family:var(--mono);font-size:1.6rem;letter-spacing:.3em;background:var(--bg);border-radius:10px;padding:6px 12px;display:inline-block}
form.reg{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.err{color:var(--sos);font-size:.85rem;font-weight:600}
.photo-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-pick input[type=file]{font-size:.82rem;max-width:100%}
.stars{display:flex;gap:6px}
.stars button{border:0;background:transparent;font-size:1.8rem;color:var(--line);padding:0 2px;line-height:1}
.stars button.on{color:var(--warn)}
.sos-fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:8;width:74px;height:74px;border-radius:50%;border:4px solid var(--surface);background:var(--sos);color:#fff;font-family:var(--display);font-weight:800;font-size:1.2rem;box-shadow:0 8px 24px rgba(180,20,20,.35)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,8,14,.62);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .card{max-width:420px;width:100%;max-height:100%;overflow:auto}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.btn.apoio{background:var(--warn-soft);color:var(--warn)}
.count{font-family:var(--display);font-size:4rem;font-weight:800;color:var(--sos);text-align:center;line-height:1}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.central{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.central{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td .pm{display:inline-flex;gap:4px;align-items:center}
td .pm button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700}
.log{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.log div{display:flex;gap:10px;font-size:.88rem;padding:8px 10px;border-radius:10px;background:var(--bg)}
.log div.sos{background:var(--sos-soft);color:var(--sos);font-weight:600}
.log div.desvio{background:var(--warn-soft);color:var(--warn);font-weight:600}
.log time{font-family:var(--mono);font-size:.78rem;opacity:.8;flex:none;padding-top:1px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:25px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.switch::after{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Motora</h1><small>corridas para passageiras mulheres</small></div>
    <nav class="tabs" aria-label="Perfil">
      <button data-act="view" data-v="pass">Passageira</button>
      <button data-act="view" data-v="drv">Motorista</button>
      <button data-act="view" data-v="central">Central</button>
    </nav>
  </div>
</header>
<div class="simbar">
  <label for="hourSel">Horário da simulação</label>
  <select id="hourSel">
    <option value="auto">Agora (relógio real)</option>
    <option value="9">09h (diurno)</option>
    <option value="18">18h (diurno)</option>
    <option value="23">23h (noturno)</option>
    <option value="3">03h (noturno)</option>
  </select>
  <span id="nightChip"></span>
  <span id="netSim"></span>
  <span id="modeInfo"></span>
</div>
<main id="app"></main>
<div id="fab"></div>
<div id="modal"></div>
<div id="payModal"></div>

<script>
// ---------- regras de preço ----------
const P = {desloc:3, base:4.00, km:2.20, min:0.40, freeWait:120, stopFree:60, waitMin:0.60, night:0.20, nightFrom:22, nightTo:6, minFare:8.00, maxKm:100, fee:0.15, loyal:0.05 };
const SIM = 20, TICK = 200, SPEED = 40; // espera: 1 s real = 20 s simulados; 40 km/h média cidade + rodovia
const MAPKM = 240, DEV_KM = 1, JAM_KM = 15; // lado do mapa, desvio que gera alerta e trecho engarrafado simulado, em km
// frota sustentável: modelos aceitos no cadastro. Elétricos com autonomia aproximada em km; híbridos com o tipo
const EVS = {'BYD Dolphin':400,'BYD Dolphin Mini':280,'BYD Seal':500,'BYD Yuan Plus':420,'Renault Kwid E-Tech':250,'Renault Megane E-Tech':450,'Chevrolet Bolt EUV':390,'Chevrolet Spark EUV':350,'GWM Ora 03':400,'Volvo EX30':330,'Peugeot e-2008':320,'Fiat 500e':230,'JAC E-JS1':280,'Nissan Leaf':270};
const HYB = {'Toyota Corolla Hybrid':'híbrido flex','Toyota Corolla Cross Hybrid':'híbrido flex','Toyota Yaris Cross Hybrid':'híbrido flex','Honda Civic e:HEV':'híbrido','BYD King':'híbrido plug-in','BYD Song Pro':'híbrido plug-in','BYD Song Plus':'híbrido plug-in','GWM Haval H6':'híbrido plug-in','Caoa Chery Tiggo 7 Hybrid':'híbrido','Kia Niro Hybrid':'híbrido'};
const carKind = m => EVS[m] ? `elétrico, ${EVS[m]} km de autonomia` : HYB[m] || '?';
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtKm = v => v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' km';
const mmss = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hourNow(){ const v=document.getElementById('hourSel').value; return v==='auto'? new Date().getHours() : +v; }
const isNight = h => h>=P.nightFrom || h<P.nightTo;

// (até N chamadas por motorista, fator); acima disso vale o teto
const SURGE=[[1,1],[1.5,1.2],[2,1.4],[3,1.6],[4,1.8],[5,2.0],[6,2.2]], SURGE_MAX=2.4;
// compras no porta-malas: a partir de N sacolas/caixas -> acréscimo (bagagem de mão não conta)
const BAG=[[9,0.10],[7,0.07],[5,0.05],[3,0.03]], BAG_MAX=20;
const bagPct = n => (BAG.find(([min])=>n>=min)||[0,0])[1];
function surgeOf(name){
  const r=S.regions[name]; const ratio=r.calls/Math.max(1,r.drivers);
  return (SURGE.find(([lim])=>ratio<=lim)||[0,SURGE_MAX])[1];
}
function regionOf(p){
  if(p.x>=80&&p.x<=160&&p.y>=80&&p.y<=160) return 'Centro';
  return p.y<120 ? (p.x<120?'Região Norte':'Região Leste') : (p.x<120?'Região Oeste':'Região Sul');
}
function fare({km,min,waitSec,night,surge,fiel=false,stopCharge=0,vol=0}){
  const corrida = P.base + km*P.km + min*P.min;
  const dinamica = corrida*(surge-1);
  const bagagem = (corrida+dinamica)*bagPct(vol);
  // espera no embarque: 2 min grátis; paradas: 1 min grátis em cada (stopCharge já vem descontado)
  const esperaEmb = Math.max(0,waitSec-P.freeWait)/60*P.waitMin, esperaPar = stopCharge/60*P.waitMin;
  const esperaMin = (Math.max(0,waitSec-P.freeWait)+stopCharge)/60;
  const espera = esperaEmb+esperaPar;
  // Motora Fiel: 5% sobre km e tempo (com a dinâmica deles); bandeirada e espera ficam de fora
  const desc0 = fiel ? (km*P.km + min*P.min)*surge*P.loyal : 0;
  const fechar = sub => { const n = night ? sub*P.night : 0; return {n, t:Math.max(P.minFare,sub+n), m:sub+n<P.minFare}; };
  const cheio = fechar(corrida+dinamica+bagagem+espera).t, x = fechar(corrida+dinamica+bagagem+espera-desc0);
  // taxa fixa de deslocamento: somada ao total, 100% para quem dirige (fora dos 85/15)
  return {corrida,dinamica,bagagem,espera,esperaEmb,esperaPar,esperaMin,noturno:x.n,deslocamento:P.desloc,total:x.t+P.desloc,minimo:x.m,desconto:cheio-x.t,cheio:cheio+P.desloc};
}
// quem dirige recebe 85% do valor sem desconto, mais a taxa de deslocamento inteira; o desconto sai da parte da Motora
const driverShare = f => ((f.cheio ?? f.total)-(f.deslocamento||0))*(1-P.fee)+(f.deslocamento||0);
function fareRows(f, r){
  return `<div class="fare">
    <span>Corrida (${fmtKm(r.kmBase??r.km)} · ${Math.round(r.min)} min)</span><span class="num">${brl(f.corrida)}</span>
    ${f.dinamica>0?`<span>Alta demanda ${esc(r.region)} (${String(r.surge).replace('.',',')}x)</span><span class="num">${brl(f.dinamica)}</span>`:''}
    ${f.bagagem>0.004?`<span>Compras no porta-malas (${r.vol} volumes, +${Math.round(bagPct(r.vol)*100)}%)</span><span class="num">${brl(f.bagagem)}</span>`:''}
    <span>Espera no embarque (${mmss(r.waitSec)}, 2 min grátis)</span><span class="num">${brl(f.esperaEmb??f.espera)}</span>
    ${(r.stopSec||r.stopCur)?`<span>Paradas (${mmss((r.stopSec||0)+(r.stopCur||0))}, 1 min grátis em cada)</span><span class="num">${brl(f.esperaPar||0)}</span>`:''}
    ${r.night?`<span>Acréscimo noturno (+20%)</span><span class="num">${brl(f.noturno)}</span>`:''}
    ${f.desconto>0.004?`<span style="color:var(--ok)">Desconto Motora Fiel (5%, sem bandeirada)</span><span class="num" style="color:var(--ok)">−${brl(f.desconto)}</span>`:''}
    ${f.minimo?`<span class="muted small">Tarifa mínima aplicada</span><span></span>`:''}
    ${f.deslocamento?`<span>Taxa de deslocamento (fixa, 100% para ${dm().a} motorista)</span><span class="num">${brl(f.deslocamento)}</span>`:''}
    ${f.adicional>0?`<span>Rota alternativa (+${fmtKm(r.extraKm)}, paga antecipadamente)</span><span class="num">${brl(f.adicional)}</span>`:''}
    <span class="tot">Total</span><span class="tot v num">${brl(f.total)}</span>
  </div>`;
}

// ---------- estado ----------
const exPass = {name:'Juliana Ferreira',cpf:'123.456.789-09',birth:'1994-05-12',phone:'(11) 98765-4321',email:'juliana@exemplo.com',emerName:'Marta Ferreira (mãe)',emerPhone:'(11) 91234-5678'};
const isoIn = d => new Date(Date.now()+d*864e5).toISOString().slice(0,10);
const exDrv = {cnhVal:isoIn(900),crlvVal:isoIn(20),btTipo:'multimidia',btNome:'BYD Dolphin',name:'Rosana Lima',cpf:'987.654.321-00',birth:'1986-09-03',phone:'(11) 99876-1122',email:'rosana@exemplo.com',emerName:'Paula Lima (irmã)',emerPhone:'(11) 93456-7788',sex:'F',cnh:'04512378901',car:'BYD Dolphin',color:'Branco',year:'2021',plate:'RTA-4F21'};
const S = {
  view:'pass',
  pass:{reg:false, data:{...exPass}, photo:null, rating:4.9, err:'', prefFem:false, card:null, loyal:false},
  drv:{reg:false, data:{...exDrv}, photo:null, rating:4.95, err:'', online:true, pos:{x:115,y:130}, earnings:0, trips:0, payOk:false, payUrl:null},
  editing:null, pick:'dest', origin:{x:100,y:140}, dest:{x:150,y:110},
  regions:{'Centro':{calls:18,drivers:9},'Região Norte':{calls:6,drivers:7},'Região Leste':{calls:22,drivers:8},'Região Oeste':{calls:9,drivers:5},'Região Sul':{calls:5,drivers:6}},
  ride:null, log:[], sos:null, sosPending:null, shared:false
};
function log(type,text){ S.log.unshift({t:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),type,text}); }

function avatarSvg(name, hue){
  const ini=name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="hsl(${hue},55%,62%)"/><circle cx="40" cy="32" r="14" fill="hsl(${hue},45%,85%)"/><path d="M14 76c4-16 16-22 26-22s22 6 26 22z" fill="hsl(${hue},45%,85%)"/><text x="40" y="38" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="hsl(${hue},55%,30%)">${ini}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

// ---------- geometria ----------
const pathOf = (a,b) => [a,{x:b.x,y:a.y},b];
const dist = (a,b) => Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
function pathLen(p){ let s=0; for(let i=1;i<p.length;i++) s+=dist(p[i-1],p[i]); return s; }
function pointAt(p,d){
  for(let i=1;i<p.length;i++){ const L=dist(p[i-1],p[i]);
    if(d<=L||i===p.length-1){ const f=L?Math.min(1,d/L):1; return {x:p[i-1].x+(p[i].x-p[i-1].x)*f, y:p[i-1].y+(p[i].y-p[i-1].y)*f, horiz:p[i-1].y===p[i].y}; }
    d-=L; }
  return p[p.length-1];
}
function estimate(o,d){
  const br=bestRoute(o,d), km=br.km, min=br.min, region=regionOf(o), surge=surgeOf(region), night=isNight(hourNow());
  const vol=S.pass.vol||0;
  return {km,min,br,region,surge,night,vol,waitSec:0,f:fare({km,min,waitSec:0,night,surge,fiel:S.pass.loyal,vol})};
}
function carPos(){
  const r=S.ride; if(!r) return null;
  if(r.status==='accepted') return pointAt(r.approach,r.approachDone);
  if(r.status==='arrived') return r.o;
  if(r.status==='ontrip'||r.status==='done'){ const p=pointAt(r.path,r.done); return p.horiz?{x:p.x,y:p.y+r.deviate}:{x:p.x+r.deviate,y:p.y}; }
  return null;
}

// ---------- ocorrências de trânsito e melhor rota ----------
const OC_TIPO = {acidente:{n:'Acidente',min:15,h:2,ic:'💥'},obra:{n:'Obra',min:10,h:168,ic:'🚧'},engarrafamento:{n:'Engarrafamento',min:20,h:1,ic:'🚦'},policiamento:{n:'Policiamento',min:0,h:2,ic:'👮'},blitz:{n:'Blitz',min:0,h:3,ic:'🚨'}};
const OC_RAIO = 1, OC_DESVIO = 6;
S.ocorr = [ // exemplos do protótipo; com o servidor, a lista vem dele
  {id:'oc-ex1',tipo:'obra',x:60,y:200,por:'Central',obs:'Recapeamento',exp:Infinity,ex:true},
  {id:'oc-ex2',tipo:'policiamento',x:200,y:60,por:'Central',obs:null,exp:Infinity,ex:true}];
const ocAtivas = () => S.ocorr.filter(o=>o.exp>S.simT);
function segDist(p,a,b){ const dx=b.x-a.x, dy=b.y-a.y, L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/L)):0; return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy)); }
const nearPath = (p,path) => { let m=Infinity; for(let i=1;i<path.length;i++) m=Math.min(m,segDist(p,path[i-1],path[i])); return m; };
function candRoutes(a,b){
  a={x:a.x,y:a.y}; b={x:b.x,y:b.y}; const cl=v=>Math.max(0,Math.min(MAPKM,v));
  const lo=Math.min(a.y,b.y), hi=Math.max(a.y,b.y), lx=Math.min(a.x,b.x), hx=Math.max(a.x,b.x);
  return [[a,{x:b.x,y:a.y},b],[a,{x:a.x,y:b.y},b],
    ...[(lo+hi)/2,lo-OC_DESVIO,hi+OC_DESVIO].map(y=>[a,{x:a.x,y:cl(y)},{x:b.x,y:cl(y)},b]),
    ...[(lx+hx)/2,lx-OC_DESVIO,hx+OC_DESVIO].map(x=>[a,{x:cl(x),y:a.y},{x:cl(x),y:b.y},b])];
}
// a mesma regra do servidor: menor tempo estimado; no empate, a mais curta e depois a rota padrão
function bestRoute(a,b){
  const oc=ocAtivas(); let best=null, padrao=null;
  for(const path of candRoutes(a,b)){
    const km=Math.round(pathLen(path)*100)/100, perto=oc.filter(o=>nearPath(o,path)<=OC_RAIO), atraso=perto.reduce((s,o)=>s+OC_TIPO[o.tipo].min,0);
    const it={path,km,min:km/SPEED*60+atraso,atraso,perto}; padrao=padrao||it;
    if(!best || Math.round(it.min*100)<Math.round(best.min*100) || (Math.round(it.min*100)===Math.round(best.min*100) && km<best.km)) best=it; }
  const evit=padrao.perto.filter(o=>!best.perto.includes(o));
  const obs=best.perto.map(o=>`${OC_TIPO[o.tipo].n} no trajeto${OC_TIPO[o.tipo].min?` (+${OC_TIPO[o.tipo].min} min)`:''}`);
  if(evit.length) obs.unshift(`Rota desviada para evitar: ${evit.map(o=>OC_TIPO[o.tipo].n.toLowerCase()).join(', ')} (${best.km-padrao.km<0.05?'mesma distância':'+'+fmtKm(best.km-padrao.km)}, ${Math.round(padrao.min-best.min)} min a menos)`);
  return {...best,obs,evit};
}
function loadOcorr(){ if(API.on) api('GET','/api/ocorrencias').then(j=>{ S.ocorr=j.ocorrencias.map(o=>({id:o.id,sid:o.id,tipo:o.tipo,x:o.x,y:o.y,por:o.por_nome,obs:o.obs,exp:Infinity})); render(); }).catch(()=>{}); }
function ocorrSvg(){
  return ocAtivas().map(o=>`<g transform="translate(${o.x*K},${o.y*K})" aria-label="${OC_TIPO[o.tipo].n}"><rect x="-9" y="-9" width="18" height="18" rx="5" fill="var(--surface)" stroke="var(--warn)" stroke-width="2"/><text y="4.5" font-size="11" text-anchor="middle">${OC_TIPO[o.tipo].ic}</text></g>`).join('');
}
const routeObsBox = obs => obs&&obs.length ? `<div class="alert warn small"><span>${obs.map(esc).join('<br>')}</span></div>` : '';
// ---------- mapa ----------
const K=300/MAPKM;
function mapSvg({clickable=false, limit=false, idle=false, stale=false, act='map', postos=false}={}){
  const r=S.ride, o=r?r.o:S.origin, d=r?r.d:S.dest;
  let s=`<svg viewBox="0 0 300 300" role="img" aria-label="Mapa simulado da cidade" ${clickable?`data-act="${act}"`:''}>`;
  s+=`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--warn)" fill-opacity=".12"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--warn)" stroke-width="2" stroke-opacity=".55"/></pattern></defs>`;
  s+=`<rect width="300" height="300" fill="var(--map)"/>`;
  s+=`<rect x="0" y="0" width="150" height="150" fill="var(--z1)"/><rect x="150" y="0" width="150" height="150" fill="var(--z2)"/><rect x="0" y="150" width="150" height="150" fill="var(--z3)"/><rect x="150" y="150" width="150" height="150" fill="var(--z4)"/><rect x="100" y="100" width="100" height="100" fill="var(--z0)"/>`;
  for(let i=0;i<=12;i++){ const w=i%4===0?5:2.5; s+=`<line x1="${i*25}" y1="0" x2="${i*25}" y2="300" stroke="var(--street)" stroke-width="${w}"/><line x1="0" y1="${i*25}" x2="300" y2="${i*25}" stroke="var(--street)" stroke-width="${w}"/>`; }
  const lab=(x,y,t,a='start')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="9" font-weight="700" fill="var(--muted)" font-family="Figtree,sans-serif" letter-spacing=".08em">${t.toUpperCase()}</text>`;
  s+=lab(8,16,'Região Norte')+lab(292,16,'Região Leste','end')+lab(8,292,'Região Oeste')+lab(292,292,'Região Sul','end')+lab(130,114,'Centro');
  s+=zonesSvg(); s+=ocorrSvg(); if(S.view==='drv') s+=areaSvg();
  if(postos) s+=postosSvg();
  if(limit && o){ const pts=[[o.x+P.maxKm,o.y],[o.x,o.y+P.maxKm],[o.x-P.maxKm,o.y],[o.x,o.y-P.maxKm]].map(([x,y])=>`${x*K},${y*K}`).join(' ');
    s+=`<polygon points="${pts}" fill="var(--accent)" fill-opacity=".06" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>`; }
  if(r && r.status==='accepted'){ s+=`<polyline points="${r.approach.map(p=>p.x*K+','+p.y*K).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="4 4"/>`; }
  const route = r&&r.path ? r.path : (o&&d?bestRoute(o,d).path:null);
  if(route){ s+=`<polyline points="${route.map(p=>p.x*K+','+p.y*K).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`; }
  if(r && r.traffic){ const a=r.done, seg=[pointAt(r.path,a)]; for(let k=1;k<=10;k++) seg.push(pointAt(r.path,Math.min(r.km,a+k*JAM_KM/10)));
    s+=`<polyline points="${seg.map(p=>p.x*K+','+p.y*K).join(' ')}" fill="none" stroke="var(--sos)" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 3"/>`; }
  if(r && r.proposal){ s+=`<polyline points="${r.proposal.alt.map(p=>p.x*K+','+p.y*K).join(' ')}" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="6 4" stroke-linejoin="round"/>`; }
  if(o){ s+=`<circle cx="${o.x*K}" cy="${o.y*K}" r="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/><text x="${o.x*K}" y="${o.y*K+3.5}" font-size="10" text-anchor="middle" font-weight="800" fill="var(--accent)" font-family="Figtree,sans-serif">A</text>`; }
  if(d){ s+=`<path d="M${d.x*K} ${d.y*K} l-8 -14 a9 9 0 1 1 16 0 z" fill="var(--accent)"/><text x="${d.x*K}" y="${d.y*K-15}" font-size="9" text-anchor="middle" font-weight="800" fill="var(--accent-ink)" font-family="Figtree,sans-serif">B</text>`; }
  const useSeen = stale && r && r.seen && weak('drv');
  const c = (useSeen ? r.seen.pos : carPos()) || (idle? S.drv.pos : null);
  if(c){ const off = r && r.deviate>DEV_KM; s+=`<g transform="translate(${c.x*K},${c.y*K})"><circle r="13" fill="${off?'var(--warn)':'var(--ink)'}" fill-opacity=".18"/><rect x="-8" y="-6" width="16" height="12" rx="4" fill="${off?'var(--warn)':'var(--ink)'}" ${useSeen?'fill-opacity=".45" stroke="var(--warn)" stroke-width="2" stroke-dasharray="3 2"':''}/><rect x="-5" y="-4" width="10" height="4" rx="1.5" fill="var(--surface)"/></g>`; }
  s+=`<text x="292" y="${limit?280:0}" font-size="0"></text></svg>`;
  return s;
}

// ---------- servidor (ativo quando o app é aberto pelo servidor Python) ----------
const API = { on:false };
async function api(method, path, body){
  const r = await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j = await r.json().catch(()=>({})); if(!r.ok) throw j; return j;
}
function apiErr(e){ const d=e&&e.detail; return d&&d.erros ? d.erros.join(' ') : (typeof d==='string' ? d : 'Não foi possível falar com o servidor.'); }
function sync(method, path, body, ok){
  if(!API.on) return;
  api(method,path,body).then(j=>{ if(ok){ ok(j); render(); } }).catch(e=>{ log('desvio','Servidor: '+apiErr(e)); render(); });
}
const rid = () => S.ride && S.ride.id;
function cadastroPayload(who,d,u){
  const base={nome:d.name,cpf:d.cpf,nascimento:d.birth,telefone:d.phone,email:d.email,contato_nome:d.emerName,contato_telefone:d.emerPhone,aceite_monitoramento:true,foto:u.photo};
  return who==='pass' ? {...base,declaracao_mulher:true}
    : {...base,sexo:d.sex,declaracao_veracidade:true,cnh:d.cnh,cnh_validade:d.cnhVal,crlv_validade:d.crlvVal,bluetooth_tipo:d.btTipo,bluetooth_nome:d.btNome||null,placa:d.plate,modelo:d.car,cor:d.color,ano:+d.year};
}
(async()=>{ try{ const r=await fetch('/api/saude'); const j=r.ok?await r.json():null; if(j&&j.ok){ API.on=true; loadZones(); loadPostos(); loadOcorr(); render(); } }catch(_){} })();

function submitReg(form){
  const who=form.dataset.who, u=S[who], fd=new FormData(form), d={};
  for(const k of Object.keys(u.data)) d[k]=(fd.get(k)||'').toString().trim();
  const digits=s=>s.replace(/\D/g,'');
  let err='';
  const age = d.birth ? (Date.now()-new Date(d.birth))/31557600000 : 0;
  if(!d.name || d.name.split(/\s+/).length<2) err='Informe o nome completo.';
  else if(digits(d.cpf).length!==11) err='O CPF precisa ter 11 dígitos.';
  else if(age<18) err='É preciso ter 18 anos ou mais.';
  else if(digits(d.phone).length<10) err='Informe um celular com DDD.';
  else if(!/^\S+@\S+\.\S+$/.test(d.email)) err='Informe um e-mail válido.';
  else if(!d.emerName || digits(d.emerPhone).length<10) err='Informe o contato de emergência com telefone.';
  else if(who==='drv' && digits(d.cnh).length!==11) err='A CNH precisa ter 11 dígitos.';
  else if(who==='drv' && (!d.cnhVal || daysTo(d.cnhVal)<0)) err='A CNH está vencida. Renove para continuar.';
  else if(who==='drv' && !/^[A-Z]{3}-?\d[A-Z0-9]\d{2}$/i.test(d.plate)) err='Placa inválida. Use o formato ABC-1D23.';
  else if(who==='drv' && (!d.crlvVal || daysTo(d.crlvVal)<0)) err='O CRLV está vencido. Faça o licenciamento do veículo para continuar.';
  else if(who==='drv' && d.btTipo!=='nenhum' && !d.btNome) err='Informe o nome do Bluetooth do veículo, como aparece no celular.';
  else if(who==='drv' && !EVS[d.car] && !HYB[d.car]) err='Só aceitamos veículos elétricos ou híbridos da lista.';
  else if(who==='drv' && (+d.year<2014)) err='O veículo precisa ser 2014 ou mais novo.';
  else if(!fd.get('decl')) err='Confirme a declaração para continuar.';
  else if(!fd.get('terms')) err='O monitoramento de percurso é obrigatório para usar o app.';
  else if(!fd.get('tips')) err='Aceite as dicas de bom convívio e a regra da taxa de limpeza.';
  u.data=d; u.err=err; u.decl=!!fd.get('decl'); u.tipsOk=!!fd.get('tips');
  // quem dirige e já tem cadastro: só atualiza as validades (documento renovado), sem criar outra conta
  if(!err && API.on && who==='drv' && u.id){ api('PUT',`/api/motoristas/${u.id}/documentos`,{cnh_validade:d.cnhVal,crlv_validade:d.crlvVal,bluetooth_tipo:d.btTipo,bluetooth_nome:d.btNome||null})
      .catch(e=>{ u.err=apiErr(e); render(); }); }
  else if(!err && API.on){ api('POST', who==='pass'?'/api/passageiras':'/api/motoristas', cadastroPayload(who,d,u))
      .then(j=>{ u.id=j.id; }).catch(e=>{ u.reg=false; u.err=apiErr(e); render(); }); }
  if(!err && who==='drv' && !u.reg){ S.drv.vida.ate=S.simT+VIDA_MIN[0]*60; }
  if(!err){ const first=!u.reg; u.reg=true; S.editing=null; log('info',`${who==='drv'?'Motorista':'Passageira'} ${d.name} ${first?(who==='drv'&&d.sex==='M'?'cadastrado.':'cadastrada.')+' Verificação facial e documento aprovados (simulado).':'atualizou o cadastro.'}`); }
  render();
}

// ---------- telas: passageira ----------

// ---------- sinal de internet ----------
// Cada aparelho mede o próprio sinal (rede informada pelo navegador + tempo de resposta do servidor).
// Na demo, os botões "Sinal" no topo simulam sinal fraco para cada lado.
const NET = { real:'bom', ping:null, sim:{pass:false, drv:false}, last:{pass:'bom', drv:'bom'} };
const quality = who => NET.sim[who] ? 'fraco' : NET.real;
const weak = who => quality(who) !== 'bom';
async function measureNet(){
  const cn = navigator.connection || {};
  let q = navigator.onLine===false ? 'sem' : (['slow-2g','2g'].includes(cn.effectiveType) || cn.rtt>700) ? 'fraco' : 'bom';
  if(API.on && q!=='sem'){ const t0=performance.now();
    try{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),4000); await fetch('/api/saude',{cache:'no-store',signal:ctl.signal}); clearTimeout(to); NET.ping=performance.now()-t0; if(NET.ping>1500) q='fraco'; }
    catch(_){ q='sem'; } }
  if(q!==NET.real){ NET.real=q; netChanged(); }
}
function netChanged(){
  for(const who of ['pass','drv']){ const q=quality(who); if(q===NET.last[who]) continue; NET.last[who]=q;
    const nome = who==='pass' ? 'da passageira' : dm().d+' motorista';
    log(q==='bom'?'info':'desvio', q==='bom' ? `Sinal de internet ${nome} normalizado.` : `Sinal de internet ${q==='sem'?'perdido':'fraco'} na localização ${nome}. Localização e chegada podem atrasar.`);
    const onde = netPos(who);
    if(q!=='bom' && onde) addLocalReport(onde,q);
    if(rid()) sync('POST',`/api/corridas/${rid()}/sinal`,{por:who==='pass'?'passageira':'motorista',qualidade:q,rtt_ms:NET.ping?Math.round(NET.ping):null,...(onde||{})},()=>loadZones()); }
  render();
}
addEventListener('online',measureNet); addEventListener('offline',measureNet);
try{ navigator.connection && navigator.connection.addEventListener('change',measureNet); }catch(_){}
setInterval(measureNet,5000); measureNet();
function netBox(viewer){
  const r=S.ride; if(!r || !['searching','accepted','arrived','ontrip'].includes(r.status)) return '';
  const other = viewer==='pass' ? 'drv' : 'pass', mine=quality(viewer), theirs=quality(other);
  const out=[];
  if(r.zoneAlert && r.status!=='searching') out.push(r.zoneAlert);
  if(mine!=='bom') out.push(viewer==='pass'
    ? `${mine==='sem'?'Você está sem internet.':'Seu sinal de internet está fraco.'} Sua localização pode chegar com atraso para ${dm().a} motorista, e a chegada ao embarque pode demorar a atualizar.`
    : `${mine==='sem'?'Você está sem internet.':'Seu sinal de internet está fraco.'} A passageira pode ver sua posição e sua chegada com atraso.`);
  if(theirs!=='bom' && r.status!=='searching'){
    const age = r.seen ? Math.round((Date.now()-r.seen.t)/1000) : 0;
    out.push(viewer==='pass'
      ? `Sinal de internet ${theirs==='sem'?'perdido':'fraco'} na localização d${dm().a} motorista. A posição do carro e o horário de chegada ao embarque podem estar imprecisos.${age>1?` Última posição recebida há ${age} s.`:''}`
      : `Sinal de internet ${theirs==='sem'?'perdido':'fraco'} na localização da passageira. Ela pode demorar a ver sua chegada; confira o ponto de embarque com atenção.`); }
  return out.length ? `<div class="alert warn" role="status"><span>📶 ${out.join('</span><span>📶 ')}</span></div>` : '';
}

// ---------- zonas de sinal fraco ----------
// Com servidor: vêm de /api/zonas-sinal (formadas pelos relatos das corridas e marcadas pela central).
// Sem servidor: exemplos marcados como tal + relatos feitos neste aparelho.
const CELL_KM = 10;
S.zones = [
  {id:'ex-1',tipo:'automatica',celula:'3:5',centro:{x:35,y:55},lado_km:CELL_KM,relatos:4,nivel:'fraco',regiao:'Região Norte',nota:'exemplo'},
  {id:'ex-2',tipo:'automatica',celula:'19:16',centro:{x:195,y:165},lado_km:CELL_KM,relatos:7,nivel:'sem sinal',regiao:'Região Sul',nota:'exemplo'},
  {id:'ex-3',tipo:'manual',centro:{x:130,y:200},raio_km:8,nivel:'fraco',regiao:'Região Sul',nota:'Túnel da serra (exemplo)'},
];
S.markZone=false;
const cellOf = p => `${Math.floor(p.x/CELL_KM)}:${Math.floor(p.y/CELL_KM)}`;
const cellCenter = c => { const [i,j]=c.split(':').map(Number); return {x:(i+.5)*CELL_KM, y:(j+.5)*CELL_KM}; };
function zoneAt(p){
  return S.zones.find(z => z.tipo==='automatica' ? z.celula===cellOf(p) : Math.hypot(p.x-z.centro.x,p.y-z.centro.y)<=z.raio_km) || null;
}
function routeAlert(path){
  if(!path || !S.dest) return null;
  const len=pathLen(path); if(!len) return null;
  const emb=zoneAt(path[0]), dst=zoneAt(path[path.length-1]); let trajeto=false;
  for(let k=0;k<=Math.ceil(len);k++){ if(zoneAt(pointAt(path,Math.min(len,k)))){ trajeto=true; break; } }
  const partes=[emb&&'no embarque', dst&&'no destino'].filter(Boolean); if(trajeto && !partes.length) partes.push('no trajeto');
  return partes.length ? `Região com sinal de internet fraco ${partes.join(' e ')}. A localização e o horário de chegada podem atrasar.` : null;
}
const zoneAlertBox = msg => msg ? `<div class="alert warn" role="status"><span>📶 ${msg}</span></div>` : '';
function netPos(who){
  const r=S.ride;
  if(who==='drv') return carPos() || {...S.drv.pos};
  if(r && ['searching','accepted','arrived'].includes(r.status)) return {...r.o};
  return (r && carPos()) || {...S.origin};
}
function addLocalReport(p,q){
  if(API.on) return; // o servidor cuida
  const cel=cellOf(p), z=S.zones.find(z=>z.tipo==='automatica'&&z.celula===cel);
  if(z){ z.relatos++; if(q==='sem') z.nivel='sem sinal'; }
  else S.zones.unshift({id:'loc-'+cel,tipo:'automatica',celula:cel,centro:cellCenter(cel),lado_km:CELL_KM,relatos:1,nivel:q==='sem'?'sem sinal':'fraco',regiao:regionOf(cellCenter(cel)),nota:null});
}

const drvWorking = () => S.drv.reg && (S.drv.online || (S.ride && ['accepted','arrived','ontrip'].includes(S.ride.status)));
function btChanged(){
  const bt=S.drv.bt;
  if(S.drv.id) sync('POST',`/api/motoristas/${S.drv.id}/conexao`,{bluetooth:bt.on,bateria:bt.bat,corrida_id:rid()||null});
  if(!btTem()) return render();
  if(!bt.on && drvWorking() && !S.assalto){
    log('desvio',`Celular de ${S.drv.data.name} desconectou do Bluetooth do carro. Perguntamos se está tudo bem.`);
    if(!S.bem) S.bem={t0:Date.now(),parado:0,cid:rid(),motivo:'bluetooth'};
  } else if(bt.on){
    if(S.bem && S.bem.motivo==='bluetooth'){ S.bem=null; }
    if(drvWorking()) log('info',`Celular de ${S.drv.data.name} reconectou ao Bluetooth do carro.`);
  }
  render();
}

function jornadaTick(){
  S.simT+=SIM;
  if(S.drv.reg && !S.assalto){
    const r=S.ride, busy=r && ['accepted','arrived','ontrip'].includes(r.status);
    // prova de vida vencida: pede de novo (a corrida em andamento continua)
    if(S.drv.online && !vidaOk() && !busy && !S.vidaModal && !S.drv.vidaPedida){ S.drv.vidaPedida=true; S.vidaModal={auto:true}; log('info',`Prova de vida de ${S.drv.data.name} venceu. Nova selfie pedida.`); render(); }
    // parada longa: espera no embarque, parada na viagem ou disponível sem chamada
    const parado = r&&r.status==='arrived' ? r.waitSec : r&&r.status==='ontrip'&&r.stopping ? (r.stopCur||0) : (!busy&&S.drv.online ? (S.drv.idle=(S.drv.idle||0)+SIM) : 0);
    if(!S.drv.online || busy) S.drv.idle=0;
    const lim = busy ? PARADO_SEG : PARADO_IDLE_SEG, key=(r&&r.status)+':'+(r&&r.status==='ontrip'?(r.stopSec||0):'');
    if(parado>=lim && !S.bem && S.bemKey!==key){ S.bemKey=key; S.bem={t0:Date.now(),parado,cid:rid()}; log('desvio',`${S.drv.data.name} está parad${dm().a} há ${Math.round(parado/60)} min. Perguntamos se está tudo bem.`); render(); }
    if(S.bem){ if(Date.now()-S.bem.t0>=BEM_RESP_SEG*1000) A.bem({r:'sem_resposta'}); else if(S.view==='drv' && !busy) render(); }
  }
  jornadaTick2(); agTick(); offerTick();
}
function jornadaTick2(){
  const J=S.drv.jor, dt=SIM, r=S.ride, busy=r && ['accepted','arrived','ontrip'].includes(r.status);
  const before=JSON.stringify([J.rest>0, Math.floor(J.work/60)]);
  if(!S.drv.reg) return;
  if(J.rest>0){ J.rest=Math.max(0,J.rest-dt); if(!J.rest){ J.work=0; log('info','Descanso obrigatório de 6 h concluído. Liberado para dirigir.'); } }
  else if(S.drv.online || busy){ J.work+=dt; J.off=0;
    if(J.work>=MAX_JOR && !busy){ J.work=MAX_JOR; J.rest=DESC_JOR; if(S.drv.online){ S.drv.online=false; S.drv.vida.saidas.push(S.simT); S.drv.vida.ate=0; const reg=S.regions[regionOf(S.drv.pos)]; reg.drivers=Math.max(0,reg.drivers-1); }
      log('info',`${S.drv.data.name} completou 12 h de trabalho. Descanso obrigatório de 6 h.`); if(S.drv.id) sync('POST',`/api/motoristas/${S.drv.id}/disponibilidade`,{online:false}); } }
  else { J.off+=dt; if(J.off>=DESC_JOR && J.work){ J.work=0; } }
  if(JSON.stringify([J.rest>0, Math.floor(J.work/60)])!==before && S.view!=='pass' && !document.querySelector('form.reg') && !busy) render();
}
setInterval(jornadaTick,1000);
function jornadaBox(){

}

function payLines(r,who){
  const pays = r.payments || [{motivo:'corrida', valor:r.final.total, taxa_motora:r.final.total-driverShare(r.final), repasse_motorista:driverShare(r.final), status:'pago'}];
  const tot = pays.reduce((a,p)=>a+(p.status==='pago'?p.valor:0),0), rep_ = pays.reduce((a,p)=>a+(p.status==='pago'?p.repasse_motorista:0),0);
  const falha = pays.find(p=>p.status==='falhou');
  if(falha) return `<div class="alert bad"><span>A cobrança de ${brl(falha.valor)} não foi aprovada. ${who==='pass'?'Atualize seu cartão para concluir o pagamento.':'Avisamos a passageira; o repasse sai quando o pagamento for aprovado.'}</span></div>`;
  return who==='pass'
    ? `<p class="small muted">Pago ${brl(tot)} no cartão${S.pass.card?' •••• '+esc(S.pass.card.final):''}${pays.length>1?` (${pays.length} cobranças, incluindo a rota alternativa)`:''}.</p>`
    : `<div class="fare small"><span>Repasse para sua conta (85% + R$ 3,00 de deslocamento)</span><span class="num">${brl(rep_)}</span><span class="muted">Parte da Motora (15%${r.final&&r.final.desconto>0.004?', menos o desconto Fiel':''})</span><span class="num muted">${brl(tot-rep_)}</span></div>`;
}
let stripeJs=null;
function loadStripe(){ return stripeJs || (stripeJs=new Promise((ok,err)=>{ const sc=document.createElement('script'); sc.src='https://js.stripe.com/v3/'; sc.onload=()=>ok(window.Stripe); sc.onerror=err; document.head.appendChild(sc); })); }
async function openStripeCard(j){
  const box=document.getElementById('payModal');
  box.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="cardT"><div class="card"><h2 id="cardT">Adicionar cartão</h2>
    <div id="stripeEl"></div><p class="err" id="cardErr"></p>
    <div class="btns"><button class="btn ghost" id="cardCancel">Cancelar</button><button class="btn" id="cardSave">Salvar cartão</button></div>
    <p class="small muted">Pagamento processado pela Stripe. A Motora não vê nem guarda o número do cartão.</p></div></div>`;
  document.getElementById('cardCancel').onclick=()=>{ box.innerHTML=''; };
  try{
    const Stripe=await loadStripe(), stripe=Stripe(j.publishable_key), elements=stripe.elements({clientSecret:j.client_secret,locale:'pt-BR'});
    elements.create('payment').mount('#stripeEl');
    document.getElementById('cardSave').onclick=async()=>{
      const res=await stripe.confirmSetup({elements,redirect:'if_required'});
      if(res.error){ document.getElementById('cardErr').textContent=res.error.message; return; }
      try{ const c=await api('POST',`/api/passageiras/${S.pass.id}/cartao/confirmar`,{setup_intent_id:res.setupIntent.id}); S.pass.card=c.cartao; box.innerHTML=''; log('info','Cartão salvo na Stripe.'); render(); }
      catch(e){ document.getElementById('cardErr').textContent=apiErr(e); }
    };
  }catch(_){ document.getElementById('cardErr').textContent='Não foi possível carregar a Stripe. Verifique a conexão.'; }
}

const MAPA_CENTRO={lat:-23.5505,lng:-46.6333}; // Praça da Sé, São Paulo (o mesmo padrão do servidor)
function latlng(p){ const lat=MAPA_CENTRO.lat-(p.y-MAPKM/2)/110.574, lng=MAPA_CENTRO.lng+(p.x-MAPKM/2)/(111.320*Math.cos(MAPA_CENTRO.lat*Math.PI/180));
  return {lat:+lat.toFixed(6),lng:+lng.toFixed(6)}; }
const waTel = t => { let d=String(t||'').replace(/\D/g,''); if(d && !d.startsWith('55')) d='55'+d; return d.length>4?d:''; };
function waInfo(){
  const r=S.ride; if(!r) return null;
  if(API.on && rid()){
    if(!r.wa && !r.waPedido){ r.waPedido=true; sync('POST',`/api/corridas/${rid()}/compartilhar`,{},j=>{ r.wa=j; }); }
    return r.wa||null; }
  const c=S.pass.data, d=S.drv.data, g=latlng(carPos()||r.o);
  const carro=['accepted','arrived','ontrip'].includes(r.status)?` com ${d.name} (${d.car} ${d.color}, placa ${d.plate})`:'';
  const link=`https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lng}`;
  const texto=`Estou em uma corrida Motora${carro}. Veja minha localização no seu app de mapas: ${link}`, q=encodeURIComponent(texto), tel=waTel(c.emerPhone);
  return {link,texto,whatsapp:`https://wa.me/?text=${q}`,whatsapp_contato:tel?`https://wa.me/${tel}?text=${q}`:null,contato:c.emerName};
}
function shareBtn(compact){
  const w=waInfo();
  if(!w) return `<button class="btn ghost" disabled>Preparando o link do WhatsApp…</button>`;
  const principal=w.whatsapp_contato||w.whatsapp;
  return `<div style="display:flex;flex-direction:column;gap:6px"><a class="btn wa" href="${esc(principal)}" target="_blank" rel="noopener" data-wa="contato">${S.shared?'✓ ':''}${compact?'WhatsApp':`Enviar rota pelo WhatsApp${w.whatsapp_contato&&w.contato?` para ${esc(String(w.contato).split(' ')[0])}`:''}`}</a>
    ${compact?'':`<a class="small" style="text-align:center;color:var(--accent);font-weight:600" href="${esc(w.whatsapp)}" target="_blank" rel="noopener" data-wa="outro">Escolher outro contato no WhatsApp</a>`}</div>`; }

// ---------- reclamações à central (regras e objetos esquecidos) ----------
const RECL_CAT = {
  pass:{objeto_esquecido:'Esqueci um objeto no carro',conduta:'Conduta de quem dirigiu',direcao:'Direção perigosa ou desrespeito às leis de trânsito',veiculo:'Veículo diferente do cadastro, sujo ou em más condições',cobranca:'Rota ou cobrança',regras:'Outro descumprimento das regras do app',outro:'Outro assunto'},
  drv:{objeto_encontrado:'Objeto esquecido no carro',conduta:'Conduta da passageira',veiculo:'Dano ao veículo',cobranca:'Rota ou cobrança',regras:'Outro descumprimento das regras do app',outro:'Outro assunto'}};
const RECL_ST = {aberta:'Aberta',em_andamento:'Em andamento',objeto_encontrado:'Objeto encontrado',objeto_nao_encontrado:'Objeto não encontrado',entregue:'Objeto entregue',resolvida:'Resolvida'};
const RECL_FIM = ['objeto_nao_encontrado','entregue','resolvida'];
const ENTREGA = {base:30,kmBase:15,porKm:1,max:50};
const AVISO_OBJ = 'A Motora não se responsabiliza por objetos esquecidos ou perdidos no veículo. Se o objeto for encontrado, a entrega custa R$ 30,00 até 15 km e até R$ 50,00 acima disso.';
const taxaEntrega = km => km<=ENTREGA.kmBase ? ENTREGA.base : Math.round(Math.min(ENTREGA.max, ENTREGA.base+(km-ENTREGA.kmBase)*ENTREGA.porKm)*100)/100;
S.recl = []; S.reclF = {pass:null,drv:null}; S.rideHist = [];
const isObj = c => c==='objeto_esquecido'||c==='objeto_encontrado';
function reclRides(){ const rs=[...S.rideHist]; if(S.ride && !rs.includes(S.ride) && S.ride.status!=='searching') rs.unshift(S.ride); return rs.slice(0,5); }
const rideNome = (r,k) => `${k===0&&r===S.ride&&r.status!=='done'?'Corrida atual':'Corrida'} das ${r.t0||''} · ${regionOf(r.o)} → ${regionOf(r.d)}`;
function entregaInfo(r,modo){ if(!r||modo==='retirar') return null; const km=Math.round(dist(r.d, modo==='destino'?r.d:r.o)*10)/10; return {km,taxa:taxaEntrega(km)}; }
function reclCard(who){
  const f=S.reclF[who], meus=S.recl.filter(x=>x.who===who), rides=reclRides(), u=who==='pass'?S.pass:S.drv;
  const lista = meus.length ? `<div class="log">${meus.map(x=>`<div style="flex-direction:column;gap:4px;align-items:stretch">
      <span class="row between"><strong class="small">${esc(x.protocolo)} · ${esc(RECL_CAT[who][x.cat])}</strong><span class="chip ${RECL_FIM.includes(x.status)?'ok':'hot'}">${RECL_ST[x.status]}</span></span>
      ${x.obj?`<span class="small">Objeto: ${esc(x.obj.descricao)}${x.obj.taxa?` · entrega ${brl(x.obj.taxa)} (${fmtKm(x.obj.km)})`:x.obj.entrega==='retirar'&&who==='pass'?' · retirada combinada com a central, sem custo':''}</span>`:''}
      ${x.resposta?`<span class="small" style="font-weight:500">Central: “${esc(x.resposta)}”</span>`:''}</div>`).join('')}</div>` : '';
  if(!f) return `<div class="card"><div class="row between"><p class="eyebrow" style="margin:0">Reclamações</p><button class="btn ghost sm" style="width:auto" data-act="reclOpen" data-who="${who}">Abrir reclamação</button></div>
    <p class="small muted" style="margin:0">Relate à central qualquer descumprimento das regras ${who==='pass'?'por quem dirigiu':'pela passageira'}${who==='pass'?' ou um objeto esquecido no carro':' ou um objeto esquecido no seu carro'}.</p>${lista}</div>`;
  const r=rides[f.ride]||null, ent=who==='pass'&&isObj(f.cat)?entregaInfo(r,f.entrega):null;
  return `<div class="card"><p class="eyebrow">Nova reclamação</p>
    <div class="field"><label for="reclCat-${who}">Assunto</label><select id="reclCat-${who}" data-recl="cat" data-who="${who}">${Object.entries(RECL_CAT[who]).map(([k,l])=>`<option value="${k}" ${f.cat===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label for="reclRide-${who}">Corrida</label><select id="reclRide-${who}" data-recl="ride" data-who="${who}">${rides.map((x,k)=>`<option value="${k}" ${f.ride===k?'selected':''}>${esc(rideNome(x,k))}</option>`).join('')}<option value="-1" ${f.ride===-1?'selected':''}>Não é sobre uma corrida</option></select></div>
    ${isObj(f.cat)?`<div class="alert warn"><span>${AVISO_OBJ}</span></div>
      <div class="field"><label for="reclObj-${who}">Qual objeto?</label><input id="reclObj-${who}" maxlength="200" placeholder="Ex.: guarda-chuva preto"></div>
      ${who==='pass'?`<div class="field"><label for="reclEnt">Como quer receber, se for encontrado?</label><select id="reclEnt" data-recl="entrega" data-who="pass">
        <option value="retirar" ${f.entrega==='retirar'?'selected':''}>Vou retirar combinando com a central (sem custo)</option>
        <option value="destino" ${f.entrega==='destino'?'selected':''}>Entrega no destino da corrida</option>
        <option value="embarque" ${f.entrega==='embarque'?'selected':''}>Entrega no ponto de embarque</option></select></div>
        ${ent?`<div class="row between"><span>Taxa de entrega (${fmtKm(ent.km)})</span><span class="num" style="font-weight:700">${brl(ent.taxa)}</span></div><p class="small muted" style="margin:0">Cobrada no seu cartão só quando o objeto for entregue. O valor vai 100% para quem dirige.</p>`:''}`
      :'<p class="small muted" style="margin:0">A central avisa a passageira e combina a devolução. Guarde o objeto em segurança.</p>'}`:''}
    <div class="field"><label for="reclDesc-${who}">O que aconteceu?</label><textarea id="reclDesc-${who}" maxlength="1000" rows="3" placeholder="Conte com detalhes: quando, onde e o que aconteceu"></textarea></div>
    ${f.err?`<p class="err">${esc(f.err)}</p>`:''}
    <div class="btns"><button class="btn ghost" data-act="reclClose" data-who="${who}">Cancelar</button><button class="btn" data-act="reclSend" data-who="${who}">Enviar à central</button></div>${lista}</div>`;

  return `<div class="card" style="${compact?'background:var(--bg);':''}gap:8px"><p class="eyebrow" style="margin:0">Alertar a central</p>

const favRowReq = () => S.pass.favs.length ? `<div class="toggle"><button class="switch" role="switch" aria-checked="${S.favFirst}" aria-label="Chamar minhas favoritas primeiro" data-act="favFirst"></button><span>Chamar minhas favoritas primeiro <span class="small muted">(1 min só para elas)</span></span></div>` : '';
// ---------- corridas agendadas ----------
const AG_MIN_SEG = 30*60, AG_MAX_DIAS = 7, AG_MARGEM_SEG = 10*60;
S.ags = []; S.agMode = 'agora';
const agTxt = ts => new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const localISO = ts => { const d=new Date(ts-new Date().getTimezoneOffset()*6e4); return d.toISOString().slice(0,16); };
function agPrazo(a){ // tempos em segundos do relógio da simulação
  const falta=a.alvo-S.simT, br=bestRoute(S.drv.pos,a.o), desloc=br.min*60, sair=falta-desloc-AG_MARGEM_SEG;
  return {falta,desloc,sair,br,alerta: falta<desloc?'atrasado':sair<=0?'hora_de_sair':'no_prazo'};
}
const minTxt = s => s<=0 ? 'agora' : s<3600 ? `${Math.ceil(s/60)} min` : `${Math.floor(s/3600)} h ${String(Math.ceil(s%3600/60)).padStart(2,'0')}`;
function agForm(e){
  const min=localISO(Date.now()+AG_MIN_SEG*1000+60000);
  return `<div class="field"><label for="agWhen">Data e horário do embarque</label><input id="agWhen" type="datetime-local" min="${min}" max="${localISO(Date.now()+AG_MAX_DIAS*864e5)}" value="${S.agWhenV||localISO(Date.now()+3600e3)}"></div>
    ${S.pass.favs.length?`<div class="field"><label for="agFav">Motorista</label><select id="agFav"><option value="">Qualquer motorista</option><option value="drv">★ ${esc(S.drv.data.name)} (favorit${dm().a})</option></select></div>`:''}
    <p class="small muted" style="margin:0">De 30 minutos a 7 dias de antecedência. O valor é recalculado no embarque pela melhor rota do momento. Cancelar é grátis até a pessoa motorista sair para te buscar.</p>
    ${S.agErr?`<p class="err">${esc(S.agErr)}</p>`:''}`;
}
const AG_ST = {aberta:'Aguardando motorista',confirmada:'Confirmada',iniciada:'Motorista a caminho',cancelada:'Cancelada'};
function agCardPass(){
  const l=S.ags.filter(a=>a.status==='aberta'||a.status==='confirmada'); if(!l.length) return '';
  return `<div class="card"><p class="eyebrow">Corridas agendadas</p><div class="log">${l.map(a=>`<div style="flex-direction:column;gap:4px;align-items:stretch">
    <span class="row between"><strong class="small">${agTxt(a.when)} · ${regionOf(a.o)} → ${regionOf(a.d)}</strong><span class="chip ${a.status==='confirmada'?'ok':'hot'}">${AG_ST[a.status]}</span></span>
    <span class="small">${fmtKm(a.km)} · estimativa ${brl(a.f0.total)}${a.status==='confirmada'?` · com ${esc(S.drv.data.name)}`:a.fav?` · só ${esc(S.drv.data.name.split(' ')[0])} (favorit${dm().a})`:''}</span>
    ${a.late?`<span class="small" style="color:var(--warn);font-weight:600">${dm().A} motorista pode se atrasar. A central está acompanhando.</span>`:''}
    <button class="btn sm ghost" style="width:auto;align-self:flex-start" data-act="agCancel" data-i="${a.i}">Cancelar agendamento</button></div>`).join('')}</div></div>`;
}
function agCardDrv(){
  const abertas=S.ags.filter(a=>a.status==='aberta' && !a.recusou), minhas=S.ags.filter(a=>a.status==='confirmada');
  if(!abertas.length && !minhas.length) return '';
  const busy=S.ride && ['accepted','arrived','ontrip'].includes(S.ride.status);
  return `<div class="card"><p class="eyebrow">Corridas agendadas</p>
    ${minhas.map(a=>{ const p=agPrazo(a), cls=p.alerta==='atrasado'?'bad':p.alerta==='hora_de_sair'?'warn':'info';
      return `<div class="card" style="background:var(--bg);gap:6px"><span class="row between"><strong>Embarque ${agTxt(a.when)}</strong><span class="chip ok">Confirmada</span></span>
        <span class="small">${esc(S.pass.data.name.split(' ')[0])} · ${regionOf(a.o)} → ${regionOf(a.d)} · ${fmtKm(a.km)}</span>
        <div class="alert ${cls} small"><span>${p.alerta==='atrasado'?`Atenção: você não chega a tempo. São ${minTxt(p.desloc)} até o embarque e faltam ${minTxt(p.falta)}. A central foi avisada.`
          :p.alerta==='hora_de_sair'?`Hora de sair! São ${minTxt(p.desloc)} até o embarque, e o ideal é chegar 10 min antes.`
          :`Saia em ${minTxt(p.sair)} para chegar com 10 min de folga (${minTxt(p.desloc)} de deslocamento).`}</span></div>
        ${p.br.atraso?`<div class="alert warn small"><span>Trânsito até o embarque: +${p.br.atraso} min. Saia mais cedo.</span></div>`:''}${routeObsBox(p.br.obs)}
        <div class="btns"><button class="btn ghost sm" data-act="agDesistir" data-i="${a.i}">Desistir</button><button class="btn sm" data-act="agGo" data-i="${a.i}" ${busy?'disabled':''}>Sair para o embarque</button></div>
        ${p.alerta==='no_prazo'?`<button class="btn ghost sm" data-act="agDemo" data-i="${a.i}">Demo: adiantar até a hora de sair</button>`:''}</div>`; }).join('')}
    ${abertas.map(a=>`<div class="row between" style="gap:6px"><span class="small"><strong>${agTxt(a.when)}</strong> · ${regionOf(a.o)} → ${regionOf(a.d)} · ${fmtKm(a.km)} · ${brl(driverShare(a.f0))}${a.fav?' · ★ pediu você':''}</span><button class="btn sm" style="width:auto" data-act="agAccept" data-i="${a.i}">Aceitar</button></div>`).join('')}</div>`;
}
function agTick(){ // alertas de prazo para quem dirige
  for(const a of S.ags.filter(x=>x.status==='confirmada')){
    const p=agPrazo(a);
    if(p.alerta!=='no_prazo' && !a.alertSaida){ a.alertSaida=true; try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(_){}
      log('info',`Hora de ${S.drv.data.name} sair para a corrida agendada de ${agTxt(a.when)} (${minTxt(p.desloc)} até o embarque${p.br.atraso?`, +${p.br.atraso} min de trânsito`:''}).`); render(); }
    if(p.alerta==='atrasado' && !a.late){ a.late=true; log('desvio',`${S.drv.data.name} não vai chegar a tempo na corrida agendada de ${agTxt(a.when)}. Central deve acompanhar.`);
      if(a.sid) sync('GET',`/api/corridas/${a.sid}/prazo?x=${S.drv.pos.x}&y=${S.drv.pos.y}`); render(); }
  }
}
// ---------- resumo das regras (o mesmo de GET /api/regras/resumo) ----------
const RESUMO = [["Corrida", ["Passageiras: só mulheres, 18+", "Motorista: homem ou mulher; opção \"prefiro mulher\"", "Frota: só elétricos e híbridos", "Máximo: 100 km por corrida", "Rota: sempre a melhor, desviando de acidente, obra e engarrafamento", "Agendamento: de 30 min a 7 dias antes", "Favoritas: 5★ em conduta; os dois podem excluir"]], ["Chamadas", ["Oferta: 20 s por motorista, até 3 vezes", "Poucas motoristas: chamada concentrada em quem está disponível", "Embarque: até 6 km da motorista (ignorado com poucas por perto)", "Área de atuação: 15 km em linha reta do bairro ou endereço"]], ["Tarifa", ["R$ 4 + R$ 2,20/km + R$ 0,40/min", "Deslocamento: R$ 3 fixo, 100% motorista", "Mínima: R$ 8", "Noturno: +20% (22h–6h)", "Dinâmica: 8 níveis, até 2,4x", "Espera: 2 min grátis no embarque, 1 min por parada; depois R$ 0,60/min", "Porta-malas: 3+ volumes, +3% a +10%", "Divisão: 85% motorista, 15% Motora", "Motora Fiel: −5% em km e tempo", "Rota alternativa: só com aceite e pagamento antes"]], ["Cancelamento e taxas", ["Grátis até 3 min; depois R$ 5 + R$ 2,20/km, até R$ 20", "Sinal fraco: taxa vai para análise da central", "Motorista que cancela: −2% na nota a cada 10 em 100, até 10%", "Limpeza: até R$ 250, com fotos e nota fiscal", "Objeto esquecido: sem responsabilidade da Motora; entrega R$ 30 até 15 km, até R$ 50"]], ["Segurança", ["SOS: 5 s para cancelar; avisa central e contato", "Rota no WhatsApp; link só durante a corrida", "Desvio acima de 1 km: alerta", "Parada longa: pergunta após 10 min; sem resposta em 60 s, central", "Modo assalto: alerta silencioso", "Bluetooth: aviso ao iniciar; desconexão alerta a central", "Prova de vida: selfie a cada saída, vale 60 a 15 min", "Chat: só durante a corrida, telefone oculto", "Denúncia grave: suspende a conta", "Reclamações: protocolo e resposta da central"]], ["Motorista", ["Jornada: máx. 12 h, depois 6 h de descanso", "CNH e CRLV: aviso 30 dias antes; vencido bloqueia", "Motora Verde: 5% a 15% em postos limpos, nota 4★+", "Alertas de trânsito: acidente, obra, engarrafamento, policiamento, blitz"]]];
S.resumoOpen = {};
function resumoCard(who){
  const open=S.resumoOpen[who];
  return `<div class="card"><div class="row between"><p class="eyebrow" style="margin:0">Resumo das regras</p><button class="btn ghost sm" style="width:auto" data-act="resumo" data-who="${who}">${open?'Fechar':'Ver todas'}</button></div>

      :'<p class="small muted" style="margin:0">Todas as regras do app em poucas palavras: corrida, chamadas, tarifa, cancelamento, segurança e motorista.</p>'}</div>`;

// ---------- área de atuação e regras das chamadas ----------
const AREA_KM = 15, CH = {seg:20, max:3, km:6, poucos:2};
const BAIRROS = {"Centro (Sé)":[120,120],"Santana":[121,113],"Lapa":[112,115],"Pinheiros":[114,122],"Butantã":[111,124],"Vila Mariana":[122,126],"Moema":[119,128],"Santo Amaro":[113,133],"Ipiranga":[125,126],"Mooca":[124,121],"Tatuapé":[128,119],"Penha":[132,117],"Itaquera":[140,119],"Guarulhos":[135,106],"Osasco":[103,119],"São Bernardo do Campo":[128,139]};
const reta = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
S.drv.area = null; S.markArea = false; S.demoPerto = null;
const naArea = p => !S.drv.area || reta(S.drv.area,p) <= AREA_KM;
// no mapa simulado (240 km de lado) quase nunca há 2 motoristas a até 6 km; a central pode simular mais
const pertoEmbarque = r => S.demoPerto ?? Math.round(((S.regions[r.region]||{}).drivers||0) * Math.PI*CH.km*CH.km/14400);
function offerInfo(r){
  const km=reta(S.drv.pos,r.o), perto=pertoEmbarque(r), poucas=perto<CH.poucos;
  return {km, perto, poucas, area:naArea(r.o), dentro6: km<=CH.km || poucas, ignorou6: km>CH.km && poucas};
}
const offerEleg = r => { const i=offerInfo(r); return i.area && i.dentro6; };
function offerStart(r){ const i=offerInfo(r); r.offer={vez:1, ate:Date.now()+CH.seg*1000, conc:i.poucas, away:false}; }
const offerMine = r => r.offer && !r.offer.away && offerEleg(r);
function offerNext(r, motivo){
  const o=r.offer, i=offerInfo(r), now=Date.now();
  if(o.away){ // voltou de outras motoristas
    r.offer = o.final ? {vez:o.vez+1, ate:now+CH.seg*1000, conc:true, away:false} : {vez:o.vez+1, ate:now+CH.seg*1000, conc:false, away:false};
    if(o.final) log('info',`Todas as motoristas perto já receberam a chamada ${CH.max} vezes: a chamada se concentra em ${S.drv.data.name}.`);
  } else if(i.poucas || o.conc){ r.offer={vez:o.vez+1, ate:now+CH.seg*1000, conc:true, away:false};
    log('info',`Poucas motoristas disponíveis perto do embarque: chamada repetida para ${S.drv.data.name} (${o.vez+1}ª vez).`);
  } else { r.offer={vez:o.vez, ate:now+CH.seg*1000, away:true, final:o.vez>=CH.max};
    log('info',`${S.drv.data.name} ${motivo==='recusa'?'recusou':'não aceitou em 20 s'}. Chamada passou para outra pessoa motorista${o.vez>=CH.max?` (já recebeu ${CH.max} vezes)`:''}.`); }
}
function offerTick(){
  const r=S.ride; if(!r || r.status!=='searching') return;
  if(!r.offer){ if(offerEleg(r)) offerStart(r); return; }
  if(Date.now()>=r.offer.ate){ offerNext(r,'tempo'); render(); }
  else if(S.view==='drv') render();
}
function offerBox(r){
  const o=r.offer, i=offerInfo(r), s=Math.max(0,Math.ceil((o.ate-Date.now())/1000));
  return `<div class="row between"><span class="chip ${s<=5?'bad':'hot'}">Aceite em ${s} s</span><span class="small muted">${o.conc?'Chamada concentrada em você (poucas motoristas)':`Chamada ${o.vez} de ${CH.max}`}</span></div>
    <span class="small">Embarque a ${fmtKm(i.km)} em linha reta${i.ignorou6?`. Acima de ${CH.km} km porque há poucas motoristas perto (${i.perto})`:''}.</span>`;
}
function areaCard(){
  const a=S.drv.area;
  return `<div class="card"><p class="eyebrow">Área de atuação</p>
    ${a?`<div class="row between"><span>Até ${AREA_KM} km em linha reta de <strong>${esc(a.nome)}</strong></span><button class="btn sm ghost" style="width:auto" data-act="areaDel">Toda a cidade</button></div>`
      :`<p class="small muted" style="margin:0">Você recebe chamadas de toda a cidade. Escolha um bairro ou marque um endereço para receber só embarques a até ${AREA_KM} km em linha reta.</p>`}
    <div class="grid2"><div class="field"><label for="areaBairro">Bairro</label><select id="areaBairro"><option value="">Escolha</option>${Object.keys(BAIRROS).map(b=>`<option ${a&&a.nome===b?'selected':''}>${b}</option>`).join('')}</select></div>
      <div class="field"><label for="areaEnd">ou endereço</label><input id="areaEnd" maxlength="120" placeholder="Rua, número"></div></div>
    <div class="btns"><button class="btn sm" data-act="areaSet">Usar bairro</button><button class="btn sm ghost" data-act="areaMark" aria-pressed="${S.markArea}">${S.markArea?'Toque no mapa…':'Marcar endereço no mapa'}</button></div>
    <p class="small muted" style="margin:0">A distância é medida em linha reta, sem contar o caminho pelas ruas.</p></div>`;
}
const areaSvg = () => S.drv.area ? `<circle cx="${S.drv.area.x*K}" cy="${S.drv.area.y*K}" r="${AREA_KM*K}" fill="var(--ok)" fill-opacity=".08" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4 3"/>` : '';
function chamadasCentral(){
  const r=S.ride;
  return `<div class="card"><p class="eyebrow">Chamadas</p><h3>Regras de despacho</h3>
    <p class="small muted">Cada chamada fica 20 s com uma motorista e passa para a próxima; cada uma recebe até 3 vezes. Embarque a até 6 km, salvo com menos de 2 motoristas nesse raio. Com poucas motoristas, a chamada se concentra em quem está disponível.</p>
    ${r&&r.status==='searching'&&r.offer?`<p class="small"><strong>Agora:</strong> ${r.offer.away?'com outra motorista':`com ${esc(S.drv.data.name)} (${r.offer.conc?'concentrada':`${r.offer.vez}ª de ${CH.max}`})`}, ${pertoEmbarque(r)} motorista(s) a até 6 km.</p>`:''}
    <div class="row" style="gap:6px;flex-wrap:wrap"><span class="small">Demo: motoristas a até 6 km do embarque</span>${[null,0,5].map(v=>`<button class="chip" data-act="demoPerto" data-v="${v}" aria-pressed="${S.demoPerto===v}">${v===null?'pelo mapa':v}</button>`).join('')}</div></div>`;

const blockedPair = () => (S.pass.blocked||[]).includes('drv') || (S.drv.blocked||[]).includes('pass');
function rv(r,who){ r.rv=r.rv||{}; return r.rv[who]=r.rv[who]||{notas:{},ocorr:[],block:false,sent:false,err:''}; }
function reviewForm(r,who){
  const v=rv(r,who), alvo = who==='pass' ? `${dm().a} motorista` : 'a passageira';
  if(v.sent) return `<div class="alert ${v.ocorr.length?'warn':'ok'}"><span>Avaliação enviada. Obrigado!</span>
    ${v.ocorr.length?`<span class="small">Sua denúncia (${v.ocorr.map(o=>OCORR[o]).join(', ')}) foi enviada à central de segurança${v.ocorr.some(o=>GRAVES.includes(o))?' e a conta denunciada foi suspensa até a análise':''}. Em perigo, ligue 190. Central de Atendimento à Mulher: 180.</span>`:''}
    ${v.block?`<span class="small">Você bloqueou ${alvo}. Vocês não serão mais pareados.</span>`:''}</div>`;
  const row=(k,label)=>`<div class="row between" style="gap:6px"><span class="small" style="min-width:0;flex:1 1 140px">${label}</span><div class="stars" role="group" aria-label="${label}">${[1,2,3,4,5].map(n=>`<button aria-label="${n} de 5 estrelas" data-act="rvStar" data-who="${who}" data-k="${k}" data-n="${n}" class="${(v.notas[k]||0)>=n?'on':''}">★</button>`).join('')}</div></div>`;
  return `<div class="card" style="background:var(--bg)"><p class="eyebrow">Avalie ${alvo}</p>
    ${Object.entries(CRIT[who]).map(([k,l])=>row(k,l)).join('')}
    <p class="small"><strong>Aconteceu algo?</strong> <span class="muted">Marque se houve:</span></p>
    <div class="row" style="gap:6px">${Object.entries(OCORR).map(([k,l])=>`<button class="chip ${v.ocorr.includes(k)?'bad':''}" aria-pressed="${v.ocorr.includes(k)}" data-act="rvOcc" data-who="${who}" data-k="${k}">${l}</button>`).join('')}</div>
    ${v.ocorr.length?`<div class="field"><label for="rvc-${who}">Conte o que aconteceu (opcional, só a central lê)</label><input id="rvc-${who}" maxlength="1000"></div>
      ${v.ocorr.some(o=>GRAVES.includes(o))?'<p class="small" style="color:var(--sos)">Ocorrência grave: a conta denunciada será suspensa até a central analisar. Em perigo, ligue 190.</p>':''}`:''}
    <div class="toggle"><button class="switch" role="switch" aria-checked="${v.block}" aria-label="Bloquear" data-act="rvBlock" data-who="${who}"></button><span>Bloquear ${alvo} <span class="small muted">(não seremos mais pareados)</span></span></div>
    ${v.err?`<p class="err">${esc(v.err)}</p>`:''}
    <button class="btn" data-act="rvSend" data-who="${who}">Enviar avaliação</button></div>`;
}
// ---------- cancelamento ----------
// Passageira: grátis por 3 min depois do aceite; depois, taxa de deslocamento (R$ 5 + R$ 2,20/km já rodado, até R$ 20),
// mais a espera se quem dirige já chegou. Com sinal fraco, a taxa vai para análise da central.
// Quem dirige: a cada 10 cancelamentos nas últimas 100 corridas, a nota cai 2%, até 10%.
const CANC={carencia:180,base:5,km:2.2,max:20,janela:100,passo:10,pct:0.02,teto:0.10};
S.cancelModal=null; S.cancelTaxas=[]; S.drv.hist=[]; S.drv.ratingBase=null;
function cancelPreview(r){
  if(!r || r.status==='searching' || r.accT==null) return {gratis:true};
  const passado=S.simT-r.accT, emb=r.status==='arrived';
  if(passado<=CANC.carencia && !emb) return {gratis:true,resta:CANC.carencia-passado};
  const desloc=Math.min(CANC.max,CANC.base+(r.approachDone||0)*CANC.km), espera=emb?liveFare(r).esperaEmb:0;
  return {gratis:false,desist:emb,desloc,espera,total:Math.round((desloc+espera)*100)/100,fraco:weak('pass')||weak('drv')};
}
const drvPen = () => Math.min(CANC.teto, Math.floor(S.drv.hist.filter(x=>x==='c').length/CANC.passo)*CANC.pct);
function applyDrvPen(){ if(S.drv.ratingBase==null) S.drv.ratingBase=S.drv.rating; S.drv.rating=Math.round(S.drv.ratingBase*(1-drvPen())*100)/100; }
function drvHist(c){ S.drv.hist.push(c); S.drv.hist=S.drv.hist.slice(-CANC.janela); applyDrvPen(); }
function cancelInfoPass(r){
  const pv=cancelPreview(r);
  if(pv.gratis) return pv.resta!=null?`<p class="small muted">Cancelamento grátis por mais ${mmss(pv.resta)}. Depois, cobramos a taxa de deslocamento.</p>`:'';
  return `<p class="small" style="color:var(--warn)">Cancelar agora custa ${brl(pv.total)} (taxa de ${pv.desist?'desistência':'deslocamento'}).</p>`;
}
function cancelModal(){
  const m=S.cancelModal; if(!m) return '';
  if(m.who==='drv'){ const n=S.drv.hist.filter(x=>x==='c').length+1, p=Math.min(CANC.teto,Math.floor(n/CANC.passo)*CANC.pct);
    return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ccT"><div class="card"><p class="eyebrow">Cancelar corrida</p><h2 id="ccT">Tem certeza?</h2>
      <p class="small">Cancelamentos afetam sua nota. A cada 10 cancelamentos nas últimas 100 corridas, sua nota cai 2%, até 10%.</p>
      <div class="fare small"><span>Seus cancelamentos com este</span><span class="num">${n} de ${Math.min(CANC.janela,S.drv.hist.length+1)} corridas</span><span>Penalidade na nota</span><span class="num">${Math.round(p*100)}%</span></div>
      <p class="small muted">A passageira volta para a fila e recebe outra pessoa motorista. Se for pneu, pane ou bateria, use o Socorro Motora.</p>
      <div class="btns"><button class="btn ghost" data-act="cancelClose">Voltar</button><button class="btn" style="background:var(--sos);color:#fff" data-act="cancelDo">Cancelar corrida</button></div></div></div>`; }
  const pv=cancelPreview(S.ride);
  return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ccT"><div class="card"><p class="eyebrow">Cancelar corrida</p><h2 id="ccT">${pv.desist?`${dm().A} motorista já chegou`:'Já passou o tempo grátis'}</h2>
    <p class="small">O cancelamento é grátis até 3 minutos depois do aceite. Agora há uma taxa para cobrir o deslocamento ${dm().d} motorista.</p>
    <div class="fare small"><span>Deslocamento</span><span class="num">${brl(pv.desloc)}</span>${pv.espera>0.004?`<span>Espera no embarque</span><span class="num">${brl(pv.espera)}</span>`:''}<span class="tot">Total</span><span class="tot v num">${brl(pv.total)}</span></div>
    ${pv.fraco?`<div class="alert warn"><span>Sinal de internet fraco: a posição ${dm().d} motorista pode estar atrasada. A taxa não será cobrada agora; a central vai analisar antes.</span></div>`:''}

function cancResumo(){

function cancelTaxasBox(){

function chatPush(who,texto){

function stars(r,key){ return `<div class="stars" role="group" aria-label="Nota">${[1,2,3,4,5].map(n=>`<button aria-label="${n} estrelas" data-act="rate" data-k="${key}" data-n="${n}" class="${(r[key]||0)>=n?'on':''}">★</button>`).join('')}</div>`; }
function liveFare(r){
  const f=fare({km:r.kmBase??r.km,min:Math.max(0,r.movingSec/60-(r.extraMin||0)),waitSec:r.waitSec,night:r.night,surge:r.surge,fiel:r.fiel,
    vol:r.vol||0,stopCharge:(r.stopCharge||0)+Math.max(0,(r.stopCur||0)-P.stopFree)});
  f.adicional=r.prepaid||0; f.total+=f.adicional; f.cheio+=f.adicional; return f;
}
// ---------- trânsito e rota alternativa ----------
function pathUntil(p,d){ const out=[p[0]]; let left=d;
  for(let i=1;i<p.length;i++){ const L=dist(p[i-1],p[i]); if(left<=L){ const q=pointAt(p,d); out.push({x:q.x,y:q.y}); return out; } out.push(p[i]); left-=L; }
  return out; }
function proposeAlt(r){
  const q=pointAt(r.path,r.done), p={x:q.x,y:q.y}, d=r.d;
  const remaining=r.km-r.done, off=6;
  // desvia pelo eixo vertical e passa um pouco do destino, para fugir do trecho parado
  const y2=Math.max(0,Math.min(MAPKM,d.y+(d.y<p.y?-off:off)));
  const alt=[p,{x:p.x,y:y2},{x:d.x,y:y2},d];
  const extraKm=Math.max(0,pathLen(alt)-remaining), extraMin=extraKm/SPEED*60;
  const valor=Math.round((extraKm*P.km+extraMin*P.min)*r.surge*(r.night?1+P.night:1)*100)/100;
  return {alt,extraKm,extraMin,valor,savesMin:Math.round((Math.max(0,remaining-JAM_KM)/SPEED + Math.min(remaining,JAM_KM)/(SPEED/3))*60 - pathLen(alt)/SPEED*60)};
}
function trafficBox(r,who){
  const pr=r.proposal;
  if(pr) return who==='pass'
    ? `<div class="alert warn"><span>Trânsito intenso à frente. ${dm().A} motorista sugere uma rota alternativa: +${fmtKm(pr.extraKm)} e chegada cerca de ${Math.max(1,pr.savesMin)} min antes.</span>
       <div class="row between"><span>Valor adicional, cobrado agora</span><span class="big num">${brl(pr.valor)}</span></div>
       <div class="alert info"><span>Lembrete: confira o engarrafamento antes de aceitar.</span>
         <ul class="steps small" style="font-weight:500"><li>No mapa, o trecho em <strong style="color:var(--sos)">vermelho</strong> é o trânsito parado e o tracejado <strong style="color:var(--warn)">laranja</strong> é a rota sugerida.</li><li>Velocidade atual do carro: <strong class="num">${Math.round(SPEED/3)} km/h</strong> (normal: ${SPEED} km/h).</li><li>Olhe pela janela e veja se o trânsito está mesmo parado.</li></ul>
         <div class="toggle"><button class="switch" role="switch" aria-checked="${!!pr.seen}" aria-label="Confirmei o engarrafamento" data-act="altSeen"></button><span>Vi o engarrafamento e confirmo</span></div></div>
       <div class="btns"><button class="btn ghost" data-act="altNo">Manter rota</button><button class="btn" data-act="altYes" ${pr.seen?'':'disabled'}>Aceitar e pagar</button></div>${S.pass.card?`<span class="small">Cobrado agora no cartão ${esc(S.pass.card.marca||'')} •••• ${esc(S.pass.card.final||'')}.</span>`:''}</div>`
    : `<div class="alert warn"><span class="pulse">Aguardando a passageira confirmar a rota alternativa (+${fmtKm(pr.extraKm)}, ${brl(pr.valor)} adicional).</span></div>`;
  if(r.traffic) return `<div class="alert warn"><span>Trânsito intenso no trajeto${r.altDeclined?'. A passageira preferiu manter a rota.':'.'}</span></div>`;
  return '';
}
function waitBox(r,stop){
  const t=stop?(r.stopCur||0):r.waitSec, lim=stop?P.stopFree:P.freeWait;
  const free=Math.max(0,lim-t), charged=Math.max(0,t-lim);
  const rate=P.waitMin*(r.night?1+P.night:1), f=liveFare(r);
  return `<div class="alert ${charged>0?'warn':'info'}"><div class="row between"><span>${stop?'Parada em andamento':'Tempo de espera no embarque'}</span><span class="big num">${mmss(t)}</span></div>
  <span class="small">${free>0?`Grátis por mais ${mmss(free)} (${stop?'1 min grátis em cada parada':'2 min grátis no embarque'}). Depois, ${brl(rate)}/min${r.night?' (com acréscimo noturno)':''}.`:`Cobrando ${brl(rate)}/min${r.night?' com acréscimo noturno':''}. ${brl((stop?f.esperaPar:f.esperaEmb)*(r.night?1+P.night:1))} até agora.`}</span></div>`;
}
function monitorBox(r,who){
  const off=r.deviate>DEV_KM;
  let h=`<div class="alert ${off?'warn':'ok'}"><span>${off?`Desvio de rota: ${fmtKm(r.deviate)} fora do trajeto. Central notificada.`:'Rota monitorada: dentro do trajeto previsto.'}</span></div>`;
  if(who==='pass' && r.checkPending) h+=`<div class="alert bad"><span>Notamos uma mudança no trajeto. Está tudo bem?</span><div class="btns"><button class="btn ok" data-act="imok">Estou bem</button><button class="btn" style="background:var(--sos);color:#fff" data-act="sos" data-by="pass">Pedir socorro</button></div></div>`;
  return h;
}

    ${chatBox('drv')}${apoioBanner()}${apoioBtn('drv')}</div>${tipsBox('drv')}`;
  if(r.status==='done') return top+`<div class="card"><p class="eyebrow">Corrida concluída</p><div class="row between"><span>Seu ganho (85% + deslocamento)</span><span class="big num">${brl(driverShare(r.final))}</span></div>

  return top;
}

let sosTimer=null;
function startSos(by){ if(S.sos||S.sosPending) return; S.sosPending={by,n:5}; render();
  sosTimer=setInterval(()=>{ if(!S.sosPending){clearInterval(sosTimer);return;} S.sosPending.n--; if(S.sosPending.n<=0) fireSos(); else render(); },1000); }
function fireSos(){ const by=S.sosPending.by; clearInterval(sosTimer); S.sosPending=null;
  const c=carPos(); S.sos={by,t:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
  log('sos',`SOS acionado ${by==='pass'?'pela passageira '+S.pass.data.name:dm().p+' motorista '+S.drv.data.name}${c?` em ${regionOf(c)} (${c.x.toFixed(2)} km, ${c.y.toFixed(2)} km)`:''}. Contato de emergência avisado.`);
  if(rid()) sync('POST',`/api/corridas/${rid()}/sos`,{por:by==='pass'?'passageira':'motorista'},j=>{ if(S.sos) S.sos.link=j.link; });
  if(S.ride) S.ride.checkPending=false; render(); }

// ---------- ações ----------

  postoMap:(d,e)=>{ const svg=e.target.closest('svg'), b=svg.getBoundingClientRect();
    const p={x:Math.round((e.clientX-b.left)/b.width*MAPKM), y:Math.round((e.clientY-b.top)/b.height*MAPKM)};

    else S.postos.push({id:'local-'+Date.now(),nome,tipo,x:p.x,y:p.y,regiao:regionOf(p)});

    log('info',`Central credenciou o posto ${nome} (${TIPO_POSTO[tipo]}) em ${regionOf(p)}.`); render(); },
  postoDel:d=>{ const p=S.postos.find(x=>x.id===d.id); if(!p) return;
