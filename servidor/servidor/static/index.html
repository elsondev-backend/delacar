    else S.postos=S.postos.filter(x=>x.id!==p.id);
    log('info',`Central descredenciou o posto ${p.nome}.`); render(); },
  verdeCupom:d=>{ const p=S.postos.find(x=>x.id===d.id), v=nivelVerde(); if(!p||!verdeOk()) return; S.verde.err='';
    if(v.saldo<=0){ S.verde.err='Você já usou todo o desconto deste mês.'; render(); return; }
    if(API.on){ api('POST',`/api/motoristas/${S.drv.id}/motora-verde/cupom`,{posto_id:p.id}).then(j=>{ S.verde.cupom=j; render(); }).catch(e=>{ S.verde.err=apiErr(e); render(); }); return; }
    S.verde.cupom={codigo:'MV-'+Math.random().toString(36).slice(2,8).toUpperCase(),posto:p.nome,posto_id:p.id,desconto_pct:v.pct,nivel:v.nome}; render(); },
  verdeCancel:()=>{ S.verde.cupom=null; render(); },
  verdeUse:()=>{ const c=S.verde.cupom, valor=Math.round(parseFloat(((document.getElementById('verdeValor')||{}).value||'').replace(',','.'))*100)/100;
    if(!(valor>0)){ S.verde.err='Informe o valor abastecido.'; render(); return; }
    const fim=a=>{ S.verde.hist.unshift(a); S.verde.cupom=null; S.verde.err='';
      log('info',`Motora Verde: ${S.drv.data.name} abasteceu ${brl(a.valor)} em ${a.posto} e ganhou ${brl(a.desconto)} de desconto (${a.nivel}).`); render(); };
    if(API.on){ api('POST','/api/postos/cupom',{codigo:c.codigo,posto_id:c.posto_id,valor}).then(fim).catch(e=>{ S.verde.err=apiErr(e); render(); }); return; }
    const desconto=Math.round(Math.min(valor*c.desconto_pct,nivelVerde().saldo)*100)/100;
    fim({posto:c.posto,valor,desconto,pago:valor-desconto,nivel:c.nivel}); },
  zoneMap:(d,e)=>{ const svg=e.target.closest('svg'), b=svg.getBoundingClientRect();
    const p={x:Math.round((e.clientX-b.left)/b.width*MAPKM), y:Math.round((e.clientY-b.top)/b.height*MAPKM)};
    const nota=(document.getElementById('zoneNote')||{}).value||null, raio=+((document.getElementById('zoneRadius')||{}).value||10);
    S.markZone=false;
    if(API.on){ api('POST','/api/zonas-sinal',{x:p.x,y:p.y,raio_km:raio,nota}).then(()=>loadZones()).catch(err=>{ log('desvio','Servidor: '+apiErr(err)); render(); }); }
    else S.zones.unshift({id:'man-'+Date.now(),tipo:'manual',centro:p,raio_km:raio,nivel:'fraco',regiao:regionOf(p),nota});
    log('info',`Central marcou zona de sinal fraco em ${regionOf(p)} (raio ${raio} km).`); render(); },
  zoneDel:d=>{
    if(API.on){ api('DELETE',`/api/zonas-sinal/${encodeURIComponent(d.id)}`).then(()=>loadZones()).catch(err=>{ log('desvio','Servidor: '+apiErr(err)); render(); }); }
    else S.zones=S.zones.filter(z=>z.id!==d.id);
    log('info','Central removeu uma zona de sinal fraco.'); render(); },
  map:(d,e)=>{ const svg=e.target.closest('svg'), b=svg.getBoundingClientRect();
    const snap=v=>Math.max(0,Math.min(MAPKM,Math.round(v/2.5)*2.5));
    const p={x:snap((e.clientX-b.left)/b.width*MAPKM), y:snap((e.clientY-b.top)/b.height*MAPKM)};
    if(S.pick==='origin'){S.origin=p;S.pick='dest';} else S.dest=p; render(); },
  request:()=>{ const e=estimate(S.origin,S.dest); if(e.km>P.maxKm||e.km===0) return;
    if(S.agMode==='ag') return A.agCreate(e);
    const reg=S.regions[e.region]; reg.calls++;
    if(S.ride && ['done','cancel'].includes(S.ride.status) && !S.rideHist.includes(S.ride)) S.rideHist.unshift(S.ride);
    S.ride={status:'searching',t0:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),o:{...S.origin},d:{...S.dest},path:e.br.path,routeObs:e.br.obs,favFirst:S.favFirst&&S.pass.favs.length>0,km:e.km,min:e.min,region:e.region,surge:e.surge,night:e.night,f0:e.f,fiel:S.pass.loyal,vol:e.vol,zoneAlert:routeAlert(e.br.path),
      waitSec:0,movingSec:0,done:0,approachDone:0,stopping:false,deviate:0,devTarget:0,devAlert:false,checkPending:false,pin:String(Math.floor(1000+Math.random()*9000)),declined:false,prefFem:S.pass.prefFem};
    sync('POST','/api/corridas',{passageira_id:S.pass.id,origem:S.ride.o,destino:S.ride.d,prefere_motorista_mulher:S.pass.prefFem,volumes:e.vol,hora:hourNow(),favoritos_primeiro:S.favFirst&&S.pass.favs.length>0},
      j=>{ if(S.ride){ S.ride.id=j.id; S.ride.pin=j.pin; } });
    if(offerEleg(S.ride)) offerStart(S.ride);
    S.shared=false; log('info',`Corrida pedida em ${e.region}: ${fmtKm(e.km)}, estimativa ${brl(e.f.total)}${e.surge>1?` (dinâmica ${String(e.surge).replace('.',',')}x)`:''}${e.night?', noturna':''}.`); render(); },
  cancel:()=>{ const pv=cancelPreview(S.ride); if(!pv.gratis){ S.cancelModal={who:'pass'}; render(); return; } A.cancelDo({},null,'pass'); },
  cancelDrv:()=>{ S.cancelModal={who:'drv'}; render(); },
  cancelClose:()=>{ S.cancelModal=null; render(); },
  cancelDo:(d,e,whoArg)=>{ const who=whoArg||(S.cancelModal&&S.cancelModal.who)||'pass', r=S.ride; S.cancelModal=null;
    if(who==='drv'){
      if(rid()) sync('POST',`/api/corridas/${rid()}/cancelar`,{por:'motorista'});
      drvHist('c'); const n=S.drv.hist.filter(x=>x==='c').length;
      Object.assign(r,{status:'searching',declined:true,drvCancelled:true,approachDone:0,waitSec:0,accT:null});
      log('desvio',`${S.drv.data.name} cancelou a corrida. ${n} cancelamento(s) nas últimas ${S.drv.hist.length} corridas; penalidade na nota: ${Math.round(drvPen()*100)}%. Buscando outra pessoa motorista.`);
      render(); return; }
    const pv=cancelPreview(r), cid=rid(), ti=S.cancelTaxas.length;
    // a decisão da central só vai ao servidor se ele também deixou a taxa em análise
    if(cid) sync('POST',`/api/corridas/${cid}/cancelar`,{por:'passageira'},j=>{ const t=S.cancelTaxas.find(x=>x.i===ti);
      if(t) t.cid=(j.cancelamento||{}).status_taxa==='em_analise'?cid:null; });
    S.regions[r.region].calls=Math.max(0,S.regions[r.region].calls-1); r.status='cancel';
    if(pv.gratis) log('info','Corrida cancelada pela passageira (grátis, dentro de 3 minutos).');
    else if(pv.fraco){ S.cancelTaxas.unshift({i:ti,total:pv.total,status:'em_analise',cid:null,t:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
      log('desvio',`Cancelamento com sinal de internet fraco. Taxa de ${brl(pv.total)} em análise pela central, sem cobrança automática.`); }
    else { S.drv.earnings+=pv.total; r.cancelFee=pv.total; log('info',`Corrida cancelada pela passageira ${pv.desist?'depois da chegada (desistência)':'após 3 minutos'}: taxa de ${brl(pv.total)}, 100% para ${dm().a} motorista.`); }
    render(); },
  cancTaxa:d=>{ const t=S.cancelTaxas.find(x=>x.i===+d.i); if(!t) return; const ok=d.ok==='1';
    t.status=ok?'cobrada':'dispensada'; if(ok) S.drv.earnings+=t.total;
    if(t.cid) sync('POST',`/api/corridas/${t.cid}/taxa-cancelamento/decisao`,{aprovar:ok});
    log('info',`Central ${ok?'cobrou':'dispensou'} a taxa de cancelamento de ${brl(t.total)}.`); render(); },
  cancDemo:()=>{ for(let k=0;k<9;k++) drvHist('c'); log('info','Demo: 9 cancelamentos adicionados ao histórico.'); render(); },
  chatToggle:d=>{ S.chatOpen[d.who]=!S.chatOpen[d.who]; render(); },
  chatQuick:d=>chatPush(d.who,d.t),
  chatSend:d=>{ const el=document.getElementById('chatIn-'+d.who); const v=el?el.value:''; if(el) el.value=''; chatPush(d.who,v); },
  arrive:()=>{ const r=S.ride; if(!r||r.status!=='accepted') return; arrived(r,false); render(); },
  autoArr:()=>{ S.drv.autoArr=!S.drv.autoArr; render(); },
  decline:()=>{ const r=S.ride; if(!r.offer) offerStart(r); offerNext(r,'recusa'); if(rid()) sync('POST',`/api/corridas/${rid()}/recusar`,{motorista_id:S.drv.id}); render(); },
  accept:()=>{ const r=S.ride; if(r.drvCancelled) return; r.accT=S.simT; if(rid()) sync('POST',`/api/corridas/${rid()}/aceitar`,{motorista_id:S.drv.id,posicao:S.drv.pos}); r.status='accepted'; r.approach=bestRoute(S.drv.pos,r.o).path; log('info',`${S.drv.data.name} aceitou e está a ${fmtKm(pathLen(r.approach))} do embarque.`); render(); },
  start:()=>{ const v=(document.getElementById('pinIn')||{}).value; const r=S.ride; if(v!==r.pin){r.pinErr=true;render();return;}
    r.pinErr=false; r.status='ontrip'; log('info',`Embarque confirmado com código. Espera no embarque: ${mmss(r.waitSec)}.`);
    if(btTem() && !S.drv.bt.on) log('desvio',`${S.drv.data.name} iniciou a corrida sem o celular no Bluetooth do carro. Lembrete enviado.`);
    // compartilhamento automático da rota com o contato de emergência da passageira

    render(); },
  stop:()=>{ const r=S.ride; r.stopping=!r.stopping; if(!r.stopping) endStop(r); if(rid()) sync('POST',`/api/corridas/${rid()}/parada`,{ativa:r.stopping}); log('info', r.stopping?'Parada iniciada. 1 min grátis, depois cobra por minuto.':'Viagem retomada.'); render(); },
  traffic:()=>{ const r=S.ride; r.traffic=true; if(rid()) sync('POST',`/api/corridas/${rid()}/transito`); log('desvio','Trânsito intenso detectado no trajeto da corrida.'); render(); },
  altPropose:()=>{ const r=S.ride; r.proposal=proposeAlt(r);

  altSeen:()=>{ const pr=S.ride.proposal; if(pr){ pr.seen=!pr.seen; render(); } },

      .catch(e=>{ log('desvio','Servidor: '+apiErr(e)); render(); });
  },
  copyLink:(d,e)=>{ const b=e.target, t=S.ride&&S.ride.shareLink; if(!t) return; try{ navigator.clipboard.writeText(t).then(()=>{b.textContent='Link copiado';},()=>{}); }catch(_){} },
  tips:d=>{ S.tipsOpen[d.who]=!S.tipsOpen[d.who]; render(); },
  apoioOpen:d=>{ S.apoioForm={by:d.by,motivo:null,err:''}; render(); },
  apoioClose:()=>{ S.apoioForm=null; render(); },
  apoioMot:d=>{ S.apoioForm.motivo=d.k; S.apoioForm.err=''; render(); },
  apoioSend:()=>{ const f=S.apoioForm; if(!f.motivo){ f.err='Escolha o motivo do pedido de apoio.'; render(); return; }
    const det=((document.getElementById('apoioDet')||{}).value||'').trim()||null, r=S.ride;
    const pos=carPos()||r.o, tp=['pneu','bateria'].includes(f.motivo)?f.motivo:null;
    const parceiro=tp?S.postos.filter(p=>p.tipo===tp).map(p=>({...p,km:Math.hypot(p.x-pos.x,p.y-pos.y)})).sort((a,b)=>a.km-b.km)[0]||null:null;
    const ap={i:S.apoios.length,ride:r,by:f.by,motivo:f.motivo,det,parceiro,status:'aguardando',t:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),sid:null};
    S.apoios.unshift(ap); S.apoioForm=null;
    const c=carPos();
    log('sos',`Socorro Motora pedido ${f.by==='pass'?'pela passageira':dm().p+' motorista'}: ${MOT_APOIO[f.motivo]}${c?` em ${regionOf(c)}`:''}. Central deve entrar em contato.`);
    if(rid()) sync('POST',`/api/corridas/${rid()}/apoio`,{por:f.by==='pass'?'passageira':'motorista',motivo:f.motivo,detalhe:det},j=>{ ap.sid=j.id; ap.cid=rid(); });
    render(); },
  apoioAct:d=>{ const ap=S.apoios.find(a=>a.i===+d.i); if(!ap) return;
    ap.status = d.a==='atender' ? 'em_atendimento' : 'encerrado';
    if(ap.sid) sync('POST',`/api/corridas/${ap.cid}/apoio/${ap.sid}/${d.a}`);
    log('info', d.a==='atender' ? `Central está atendendo o pedido de apoio (${MOT_APOIO[ap.motivo]}).` : 'Central encerrou o pedido de apoio.'); render(); },
  limpOpen:()=>{ S.ride.limp={motivo:'roupa_molhada',fotos:[],nf:null,err:''}; render(); },
  limpClose:()=>{ S.ride.limp=null; render(); },
  limpSend:()=>{ const r=S.ride, f=r.limp, g=id=>((document.getElementById(id)||{}).value||'').trim();
    f.motivo=g('limpMot')||f.motivo; const valor=Math.round(parseFloat(g('limpValor').replace(',','.'))*100)/100, numero=g('limpNf'), desc=g('limpDesc')||null;
    f.err = !(valor>0) ? 'Informe o valor do serviço de limpeza.' : valor>LIMP_MAX ? `O valor máximo é ${brl(LIMP_MAX)}.`
      : !f.fotos.length ? 'Anexe pelo menos uma foto do veículo.' : !f.nf ? 'Anexe a nota fiscal do serviço de limpeza.' : !numero ? 'Informe o número da nota fiscal.' : '';
    if(f.err){ render(); return; }
    const t={i:S.taxas.length,ride:r,valor,motivo:f.motivo,desc,numero,fotos:f.fotos,nf:f.nf,status:'em_analise',contest:null,cid:rid()};
    S.taxas.unshift(t); r.limp=null;
    log('info',`${S.drv.data.name} pediu taxa de limpeza de ${brl(valor)} (${MOT_LIMP[t.motivo]}) com ${t.fotos.length} foto(s) e nota fiscal ${numero}. Em análise.`);
    if(t.cid) sync('POST',`/api/corridas/${t.cid}/taxa-limpeza`,{valor,motivo:t.motivo,descricao:desc,fotos:t.fotos,nota_fiscal:t.nf,numero_nota:numero},null);
    render(); },
  limpContest:d=>{ const t=S.taxas.find(x=>x.i===+d.i), m=((document.getElementById('limpCont')||{}).value||'').trim(); if(!t) return;
    if(m.length<3){ log('desvio','Contestação vazia: explique o motivo.'); render(); return; }
    t.contest=m; if(t.cid) sync('POST',`/api/corridas/${t.cid}/taxa-limpeza/contestar`,{motivo:m});
    log('info','Passageira contestou a taxa de limpeza.'); render(); },
  taxaDecide:d=>{ const t=S.taxas.find(x=>x.i===+d.i); if(!t) return; const ok=d.ok==='1';
    t.status = ok ? 'cobrada' : 'recusada';
    if(ok) S.drv.earnings+=t.valor;
    if(t.cid) sync('POST',`/api/corridas/${t.cid}/taxa-limpeza/decisao`,{aprovar:ok},j=>{ t.status=j.status; });
    log('info',`Central ${ok?'aprovou e cobrou':'recusou'} a taxa de limpeza de ${brl(t.valor)}.`); render(); },
  taxaOk:d=>{ const t=S.taxas.find(x=>x.i===+d.i); if(t) t.vistoPass=true; render(); },
  copy190:(d,e)=>{ const b=e.target; try{ navigator.clipboard.writeText('190').then(()=>{b.textContent='Copiado';},()=>{b.textContent='Disque 190';}); }catch(_){ b.textContent='Disque 190'; } },
};
document.addEventListener('click',e=>{ const w=e.target.closest('[data-wa]');
  if(w){ S.shared=true; log('info',`Passageira compartilhou a rota pelo WhatsApp${w.dataset.wa==='contato'&&S.pass.data.emerName?` com ${S.pass.data.emerName}`:''}.`); setTimeout(render,0); return; } });
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t) return; const f=A[t.dataset.act]; if(f){ e.preventDefault(); f(t.dataset,e); } });
document.addEventListener('submit',e=>{ if(e.target.matches('form.reg')){ e.preventDefault(); submitReg(e.target); } });
document.addEventListener('change',e=>{
  const rk=e.target.dataset.recl, rf=rk&&S.reclF[e.target.dataset.who];
  if(rf){ rf[rk]= rk==='ride' ? +e.target.value : e.target.value; rf.err=''; render(); return; }
  if(e.target.id==='hourSel'){ render(); return; }
  if(e.target.dataset.vida && S.vidaModal && e.target.files[0]){ const fr=new FileReader(); fr.onload=()=>{ S.vidaModal.selfie=fr.result; S.vidaModal.err=''; render(); }; fr.readAsDataURL(e.target.files[0]); return; }
  const lk=e.target.dataset.limp, lf=S.ride&&S.ride.limp;
  if(lk && lf && e.target.files.length){
    const files=[...e.target.files].slice(0, lk==='fotos'?4:1);
    if(files.some(x=>x.size>2*1024*1024)){ lf.err='Cada arquivo pode ter no máximo 2 MB.'; render(); return; }
    Promise.all(files.map(x=>new Promise(ok=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.readAsDataURL(x); }))).then(urls=>{
      if(lk==='fotos') lf.fotos=urls; else lf.nf=urls[0]; lf.err=''; render(); });
    return; }
  const who=e.target.dataset.photo; if(who && e.target.files[0]){ const fr=new FileReader();
    const form=e.target.closest('form'); fr.onload=()=>{ S[who].photo=fr.result; // guarda o que já foi digitado
      const fd=new FormData(form); for(const k of Object.keys(S[who].data)) if(fd.has(k)) S[who].data[k]=fd.get(k); render(); };
    fr.readAsDataURL(e.target.files[0]); }
});

// ---------- simulação ----------
function tick(){
  const r=S.ride; if(!r) return;
  const dt=TICK/1000*SIM, base=SPEED/3600*dt;
  // corridas longas andam mais rápido na tela (~20 s), mas o tempo cobrado segue a velocidade real
  const stepFor=len=>Math.max(base,len/90);
  if(r.status==='accepted'){ const L=pathLen(r.approach); r.approachDone=Math.min(L,r.approachDone+stepFor(L));
    if(r.approachDone>=L && !r.atPickup){ r.atPickup=true; if(S.drv.autoArr!==false) arrived(r,true); } }
  else if(r.status==='arrived'){ r.waitSec+=dt; }
  else if(r.status==='ontrip'){
    if(r.stopping) r.stopCur=(r.stopCur||0)+dt; else { const slow=r.traffic?3:1, st=stepFor(r.km)/slow; r.done+=st; r.movingSec+=st/SPEED*3600*slow; }
    r.deviate += Math.sign(r.devTarget-r.deviate)*Math.min(0.15,Math.abs(r.devTarget-r.deviate));
    if(r.deviate>DEV_KM && !r.devAlert){ r.devAlert=true; r.checkPending=true; log('desvio',`Desvio de rota detectado (${fmtKm(r.deviate)} fora do trajeto). Passageira consultada.`); }
    if(r.deviate<0.1 && r.devAlert && r.devTarget===0){ r.devAlert=false; log('info','Veículo de volta ao trajeto previsto.'); }
    if(r.done>=r.km && r.deviate<0.1){ r.done=r.km; r.status='done'; r.stopping=false; endStop(r);
      r.final=liveFare(r); S.drv.earnings+=driverShare(r.final); S.drv.trips++; drvHist('ok'); S.drv.pos={...r.d};
      S.regions[r.region].calls=Math.max(0,S.regions[r.region].calls-1);
      log('info',`Corrida concluída: ${brl(r.final.total)} (espera no embarque ${mmss(r.waitSec)}${r.stopSec?`, paradas ${mmss(r.stopSec)}`:''}).`);
      if(rid()) sync('POST',`/api/corridas/${rid()}/finalizar`,null,j=>{ if(j.tarifa_final) r.final=j.tarifa_final; if(j.pagamentos) r.payments=j.pagamentos; }); }
    else if(rid() && (r.posTick=(r.posTick||0)+1)%5===0){ const c=carPos(); sync('POST',`/api/corridas/${rid()}/posicao`,{x:c.x,y:c.y}); }
  } else return;
  r.netTick=(r.netTick||0)+1;
  if(!weak('drv') || !r.seen || r.netTick%15===0){ const c=carPos(); if(c) r.seen={pos:{x:c.x,y:c.y},t:Date.now()}; }
  if(document.querySelector('form.reg') || document.activeElement?.id==='pinIn') { if(!document.querySelector('form.reg')) refreshKeepingPin(); return; }
  render();
}
function endStop(r){ if(!r.stopCur) return; r.stopSec=(r.stopSec||0)+r.stopCur; r.stopCharge=(r.stopCharge||0)+Math.max(0,r.stopCur-P.stopFree); r.stopCur=0; }
// chegada ao embarque: automática pelo GPS (a menos de 50 m do ponto) ou pelo botão "Cheguei"
function arrived(r,auto){ r.status='arrived'; r.autoArrived=auto; if(rid()) sync('POST',`/api/corridas/${rid()}/chegada`);
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(_){}
  log('info',`${auto?'Chegada automática pelo GPS':'Motorista marcou a chegada'}: no ponto de embarque. Passageira avisada; contagem de espera iniciada.`); }
function refreshKeepingPin(){ const v=document.getElementById('pinIn').value; render(); const el=document.getElementById('pinIn'); if(el){el.value=v;el.focus();} }
setInterval(tick,TICK);

// ---------- render ----------
function render(){
  const pinVal=document.getElementById('pinIn')?.value;
  const keep=['zoneNote','zoneRadius','rvc-pass','rvc-drv','apoioDet','limpValor','limpNf','limpDesc','limpMot','limpCont','postoNome','postoTipo','verdeValor','chatIn-pass','chatIn-drv','reclDesc-pass','reclDesc-drv','reclObj-pass','reclObj-drv','ocObs','agWhen','agFav','areaEnd','areaBairro',...S.recl.map(x=>`reclResp-${x.i}`)].map(id=>{ const el=document.getElementById(id); return el?[id,el.value,document.activeElement===el]:null; }).filter(Boolean);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.view));
  document.getElementById('modeInfo').textContent = API.on ? 'Conectado ao servidor Motora: cadastros, corridas e alertas são gravados.' : 'Protótipo: mapa, GPS e servidor simulados neste aparelho.';
  document.getElementById('netSim').innerHTML = `Sinal: <button class="chip ${NET.sim.pass?'hot':''}" data-act="net" data-who="pass">Passageira ${quality('pass')}</button> <button class="chip ${NET.sim.drv?'hot':''}" data-act="net" data-who="drv">Motorista ${quality('drv')}</button> <button class="chip ${S.drv.bt.on?'':'hot'}" data-act="bt" aria-pressed="${!S.drv.bt.on}">Bluetooth do carro ${S.drv.bt.on?'conectado':'desconectado'}</button>`;
  const n=isNight(hourNow()); document.getElementById('nightChip').innerHTML=`<span class="chip ${n?'night':''}">${n?'Tarifa noturna ativa':'Tarifa diurna'}</span>`;
  document.getElementById('app').innerHTML = S.view==='central' ? centralView() : `<div class="phone">${S.view==='pass'?passView():drvView()}</div>`;
  document.getElementById('modal').innerHTML = (S.assalto&&S.view==='drv') ? '' : (sosModal() || (S.view==='drv'?vidaModal()||bemModal():'') || cancelModal() || apoioModal());
  const pin=document.getElementById('pinIn'); if(pin && pinVal) pin.value=pinVal;
  for(const [id,v,f] of keep){ const el=document.getElementById(id); if(el){ el.value=v; if(f) el.focus(); } }
  const showFab = S.view!=='central' && S[S.view].reg && !S.editing && !(S.assalto&&S.view==='drv');
  document.getElementById('fab').innerHTML = showFab?`<button class="sos-fab" data-act="sos" data-by="${S.view}" aria-label="Botão de socorro">SOS</button>`:'';
}
render();
</script>
