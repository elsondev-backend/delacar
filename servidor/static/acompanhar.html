<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhar corrida · Motora</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#F6F1F4;--surface:#fff;--ink:#24161F;--muted:#6F5E69;--line:#E7DCE3;--accent:#A8235A;--map:#EEE6EB;--street:#fff;
  --ok:#1D7A4C;--ok-soft:#DDF2E7;--warn:#9A5C00;--warn-soft:#FBEBCF;--sos:#D42A2A;--sos-soft:#FCE3E3}
@media (prefers-color-scheme:dark){:root{--bg:#150F16;--surface:#211923;--ink:#F4EAF0;--muted:#B5A2AE;--line:#3A2D3B;--accent:#E5679A;
  --map:#261D29;--street:#3A2E3D;--ok:#55C893;--ok-soft:#173326;--warn:#EDAA45;--warn-soft:#3A2A12;--sos:#FF5C5C;--sos-soft:#3E1C1C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Figtree",system-ui,sans-serif;
  padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;color:var(--accent);margin:0;font-size:1.5rem}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;font-size:1.3rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.person{display:flex;gap:12px;align-items:center}
.person img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--map)}
.alert{border-radius:12px;padding:10px 12px;font-weight:600}
.ok{background:var(--ok-soft);color:var(--ok)} .warn{background:var(--warn-soft);color:var(--warn)} .bad{background:var(--sos-soft);color:var(--sos)}
a.btn{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;font-weight:700;border-radius:12px;padding:12px}
a.btn.soft{background:var(--bg);color:var(--accent);border:1px solid var(--line)}
.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center} .links a{color:var(--accent);font-weight:600}
svg{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>Motora</h1>
  <div id="app" class="card"><p class="muted">Carregando a corrida…</p></div>
  <p class="small muted">Esta página se atualiza sozinha a cada poucos segundos e vale só durante a corrida. A localização no app de mapas é a do momento em que você toca no botão; volte aqui para vê-la de novo. Em perigo imediato, ligue 190.</p>
</main>
<script>
const token = location.pathname.split('/').pop();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = {buscando:'Procurando motorista', a_caminho:'Motorista a caminho do embarque', no_embarque:'Motorista no ponto de embarque',
  em_viagem:'Em viagem', concluida:'Chegou ao destino', cancelada:'Corrida cancelada'};
// abre o app de mapas padrão do celular: Android usa geo: (o sistema escolhe o app), iPhone o Mapas
const SO = /android/i.test(navigator.userAgent) ? 'android' : /iphone|ipad|ipod/i.test(navigator.userAgent) ? 'ios' : 'outro';
function mapaLink(g, nome){
  const ll = `${g.lat},${g.lng}`, q = encodeURIComponent(nome);
  if (SO === 'android') return `geo:${ll}?q=${ll}(${q})`;
  if (SO === 'ios') return `https://maps.apple.com/?ll=${ll}&q=${q}`;
  return `https://www.google.com/maps/search/?api=1&query=${ll}`;
}
function mapaBotoes(d){
  if (!d.geo) return '';
  const g = d.geo.posicao, ll = `${g.lat},${g.lng}`;
  const carro = ['a_caminho','no_embarque','em_viagem'].includes(d.status) ? 'Localização do carro' : 'Local da corrida';
  return `<a class="btn" href="${mapaLink(g, 'Motora: ' + carro)}">Abrir no meu app de mapas</a>
    <a class="btn soft" href="${mapaLink(d.geo.destino, 'Motora: destino')}">Ver o destino no mapa</a>
    <div class="links small"><span class="muted">Ou abra no</span><a href="https://www.google.com/maps/search/?api=1&query=${ll}">Google Maps</a><a href="https://waze.com/ul?ll=${ll}&navigate=no">Waze</a><a href="https://maps.apple.com/?ll=${ll}&q=Motora">Apple Mapas</a></div>`;
}
function mapa(d){
  const K = 300 / d.mapa_km, pt = p => `${p.x*K},${p.y*K}`;
  let s = `<svg viewBox="0 0 300 300" role="img" aria-label="Mapa da corrida"><rect width="300" height="300" fill="var(--map)"/>`;
  for (let i = 0; i <= 12; i++) s += `<line x1="${i*25}" y1="0" x2="${i*25}" y2="300" stroke="var(--street)" stroke-width="2"/><line x1="0" y1="${i*25}" x2="300" y2="${i*25}" stroke="var(--street)" stroke-width="2"/>`;
  s += `<polyline points="${d.rota.map(pt).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<circle cx="${d.origem.x*K}" cy="${d.origem.y*K}" r="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>`;
  s += `<circle cx="${d.destino.x*K}" cy="${d.destino.y*K}" r="8" fill="var(--accent)"/>`;
  if (d.posicao) s += `<circle cx="${d.posicao.x*K}" cy="${d.posicao.y*K}" r="9" fill="${d.alerta_desvio?'var(--warn)':'var(--ink)'}" stroke="var(--surface)" stroke-width="3"/>`;
  return s + '</svg>';
}
async function atualizar(){
  try {
    const r = await fetch('/api/acompanhar/' + encodeURIComponent(token));
    if (!r.ok) { const e = await r.json().catch(() => ({})); clearInterval(ciclo); document.getElementById('app').innerHTML = `<h2>${r.status === 410 ? 'Corrida encerrada' : 'Link indisponível'}</h2><p class="muted">${esc(e.detail || 'Não encontramos esta corrida.')}</p>`; return; }
    const d = await r.json(), m = d.motorista;
    let alerta = d.sos ? '<div class="alert bad">SOS acionado. A central Motora está acompanhando. Se puder, ligue 190.</div>'
      : d.alerta_desvio ? '<div class="alert warn">O carro saiu do trajeto previsto. A central foi avisada.</div>'
      : d.sinal_fraco ? `<div class="alert warn">Sinal de internet fraco no local da corrida. A posição do carro e o horário de chegada podem estar atrasados${d.atraso_posicao_seg>5?` (última posição há ${d.atraso_posicao_seg} s)`:''}.</div>`
      : d.status === 'concluida' ? `<div class="alert ok">${esc(d.passageira)} chegou ao destino.</div>`
      : d.status === 'em_viagem' ? '<div class="alert ok">Dentro do trajeto previsto.</div>' : '';
    document.getElementById('app').innerHTML = `
      <p class="small muted">Você está acompanhando a corrida de <strong>${esc(d.passageira)}</strong></p>
      <h2>${STATUS[d.status] || d.status}${d.status === 'em_viagem' ? ` · chega em ~${d.chegada_min} min` : ''}${d.parada ? ' (parada)' : ''}</h2>
      ${alerta}${mapa(d)}${mapaBotoes(d)}
      ${m.nome ? `<div class="person">${m.foto ? `<img src="${esc(m.foto)}" alt="Foto de quem dirige">` : ''}<div><strong>${esc(m.nome)}</strong><br><span class="muted small">${esc(m.modelo)} ${esc(m.cor)} · placa <strong>${esc(m.placa)}</strong></span></div></div>` : ''}`;
  } catch (e) { /* sem conexão: tenta de novo no próximo ciclo */ }
}
const ciclo = setInterval(atualizar, 3000); atualizar();
</script>
</body>
</html>
